<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Cropper · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;padding:20px;box-sizing:border-box}.w{max-width:640px;margin:20px auto;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.drop{border:2px dashed #a9bed4;border-radius:1.2rem;padding:2rem;text-align:center;color:#5a6f88;cursor:pointer;background:#f6f9fd}.drop:hover{border-color:#1e3b5c}.preset{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:1rem 0}.preset button{background:#eaf0f9;color:#1e3b5c;border:1px solid #d5e0ed;padding:.6rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.72rem}.preset button.on{background:#1e3b5c;color:#fff}.cw{text-align:center;background:#eef4fa;border-radius:1rem;padding:1rem}.cw canvas{max-width:100%;border-radius:8px}button.dl{background:#1e3b5c;color:#fff;border:none;padding:.8rem;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:1rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>✂️ Photo Cropper</h1><div class="drop" id="drop">📁 Click or drop a photo</div><input type="file" id="file" accept="image/*" hidden><div class="preset" id="preset"></div><div class="cw"><canvas id="cv"></canvas></div><button class="dl" id="dl">⬇ Download</button><a href="../">← Back</a></div><script>const P=[{n:"SSC",w:100,h:120},{n:"UPSC",w:350,h:450},{n:"IBPS",w:200,h:230},{n:"Passport",w:600,h:600},{n:"Signature",w:140,h:60},{n:"Square",w:500,h:500}];const $=i=>document.getElementById(i);let img=null,sel=P[0];$("preset").innerHTML=P.map((p,i)=>`<button data-i="${i}">${p.n}<br><small>${p.w}×${p.h}</small></button>`).join("");$("preset").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=P[+b.dataset.i];document.querySelectorAll(".preset button").forEach(x=>x.classList.toggle("on",x.dataset.i==b.dataset.i));draw()};$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};$("file").onchange=e=>load(e.target.files[0]);function load(f){if(!f)return;const r=new FileReader();r.onload=()=>{img=new Image();img.onload=()=>{document.querySelector(".preset button").classList.add("on");draw()};img.src=r.result};r.readAsDataURL(f)}function draw(){if(!img)return;const c=$("cv");c.width=sel.w;c.height=sel.h;const ctx=c.getContext("2d"),ar=sel.w/sel.h,iar=img.width/img.height;let sx=0,sy=0,sw=img.width,sh=img.height;if(iar>ar){sw=img.height*ar;sx=(img.width-sw)/2}else{sh=img.width/ar;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,sel.w,sel.h)}$("dl").onclick=()=>{if(!img)return alert("Select a photo");const a=document.createElement("a");a.download="cropped.jpg";a.href=$("cv").toDataURL("image/jpeg",.92);a.click()};</script></body></html>
