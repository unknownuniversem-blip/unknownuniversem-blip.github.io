<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Photo Cropper · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;padding:clamp(8px,1.5vw,16px)}
.w{width:100%;max-width:620px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 10px;color:#1e2b3c;font-size:clamp(1.2rem,3.6vw,1.5rem);text-align:center;font-weight:700}
.drop{border:2px dashed #a9bed4;border-radius:16px;padding:clamp(14px,3vw,22px);text-align:center;color:#5a6f88;cursor:pointer;background:linear-gradient(145deg,#f6f9fd,#eef4fa);font-size:.88rem;margin-bottom:10px}
.drop:hover{border-color:#1e3b5c}
.preset{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:10px}
.preset button{background:#eaf0f9;color:#1e3b5c;border:1px solid #d5e0ed;padding:.5rem .3rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.68rem;transition:.15s}
.preset button.on{background:#1e3b5c;color:#fff;border-color:#1e3b5c}
.custom{display:flex;gap:6px;margin-bottom:10px}
.custom input{flex:1;padding:9px 10px;border:1px solid #d5e0ed;border-radius:10px;box-sizing:border-box;font-size:.82rem}
.custom button{background:#1e3b5c;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.8rem}
.cw{text-align:center;background:linear-gradient(145deg,#eef4fa,#e3edf7);border-radius:14px;padding:12px;margin-bottom:10px}
.cw canvas{max-width:100%;max-height:44vh;border-radius:10px}
.btn{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border:none;padding:13px;border-radius:14px;font-weight:600;cursor:pointer;width:100%;font-size:.9rem;box-shadow:0 8px 20px -6px rgba(30,59,92,.5)}
</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>✂️ Photo Cropper</h1>
<div class="drop" id="drop">📁 Click or drop a photo</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="preset" id="preset"></div>
<div class="custom"><input type="number" id="cw" placeholder="Custom W px" value="600"><input type="number" id="ch" placeholder="Custom H px" value="600"><button onclick="setCustom()">Apply</button></div>
<div class="cw"><canvas id="cv"></canvas></div>
<button class="btn" id="dl">⬇ Download Cropped Photo</button>
</div>
<script>
const P=[{n:"SSC",w:100,h:120},{n:"UPSC",w:350,h:450},{n:"IBPS",w:200,h:230},{n:"Passport",w:600,h:600},{n:"Signature",w:140,h:60},{n:"Square",w:500,h:500},{n:"Story 9:16",w:720,h:1280},{n:"Aadhaar",w:200,h:250}];
const $=i=>document.getElementById(i);let img=null,sel=P[0];
$("preset").innerHTML=P.map((p,i)=>`<button data-i="${i}">${p.n}<br><small>${p.w}×${p.h}</small></button>`).join("");
$("preset").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=P[+b.dataset.i];document.querySelectorAll(".preset button").forEach(x=>x.classList.toggle("on",x.dataset.i==b.dataset.i));draw()};
function setCustom(){const w=+$("cw").value,h=+$("ch").value;if(w>0&&h>0){sel={n:"custom",w,h};document.querySelectorAll(".preset button").forEach(x=>x.classList.remove("on"));draw()}}
$("drop").onclick=()=>$("file").click();
$("drop").ondragover=e=>e.preventDefault();
$("drop").ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
$("file").onchange=e=>load(e.target.files[0]);
function load(f){if(!f)return;const r=new FileReader();r.onload=()=>{img=new Image();img.onload=()=>{document.querySelector(".preset button").classList.add("on");draw()};img.src=r.result};r.readAsDataURL(f)}
function draw(){if(!img)return;const c=$("cv");c.width=sel.w;c.height=sel.h;const ctx=c.getContext("2d"),ar=sel.w/sel.h,iar=img.width/img.height;let sx=0,sy=0,sw=img.width,sh=img.height;if(iar>ar){sw=img.height*ar;sx=(img.width-sw)/2}else{sh=img.width/ar;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,sel.w,sel.h)}
$("dl").onclick=()=>{if(!img)return alert("Please select a photo first");const a=document.createElement("a");a.download="cropped-"+sel.w+"x"+sel.h+".jpg";a.href=$("cv").toDataURL("image/jpeg",.92);a.click()};
</script></body></html>
