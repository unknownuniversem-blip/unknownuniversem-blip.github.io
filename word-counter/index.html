<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Essay Word & Character Counter · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;padding:clamp(8px,1.5vw,16px)}
.w{width:100%;max-width:720px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(16px,2.5vw,26px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 4px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.45rem);text-align:center;font-weight:700}
.sub{text-align:center;color:#5a6f88;font-size:.78rem;margin-bottom:12px}
textarea{width:100%;min-height:200px;padding:14px;border:1px solid #d5e0ed;border-radius:12px;font-size:.9rem;box-sizing:border-box;font-family:inherit;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.st{background:linear-gradient(145deg,#f6f9fd,#eef4fa);padding:.7rem;border-radius:11px;text-align:center}
.st b{display:block;font-size:1.3rem;color:#1e3b5c;font-weight:700}
.st small{font-size:.65rem;color:#5a6f88;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.share{display:flex;gap:6px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.share a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:600}
.share a.wa{background:#25D366;color:#fff}
.share a.tg{background:#0088cc;color:#fff}
</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>📝 Essay Word & Character Counter</h1>
<p class="sub">Live stats for descriptive exam papers & essays.</p>
<textarea id="ta" placeholder="Type or paste your essay here..."></textarea>
<div class="stats">
<div class="st"><b id="w">0</b><small>Words</small></div>
<div class="st"><b id="c">0</b><small>Chars</small></div>
<div class="st"><b id="cs">0</b><small>No Spaces</small></div>
<div class="st"><b id="s">0</b><small>Sentences</small></div>
<div class="st"><b id="p">0</b><small>Paragraphs</small></div>
<div class="st"><b id="r">0m</b><small>Read Time</small></div>
</div>
<div class="share">
<span style="font-size:.75rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20Essay%20Word%20Counter%3A%20https://unknownuniversem-blip.github.io/word-counter/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/word-counter/" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
function upd(){
  const t=$("ta").value;
  const words=t.trim()?t.trim().split(/\s+/):[];
  $("w").textContent=words.length;
  $("c").textContent=t.length;
  $("cs").textContent=t.replace(/\s/g,"").length;
  $("s").textContent=t.trim()?t.split(/[.!?]+/).filter(x=>x.trim()).length:0;
  $("p").textContent=t.trim()?t.split(/\n\s*\n/).filter(x=>x.trim()).length:0;
  $("r").textContent=Math.max(1,Math.round(words.length/200))+"m";
}
$("ta").addEventListener("input",upd);upd();
</script></body></html>
