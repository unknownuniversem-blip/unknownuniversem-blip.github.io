<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:520px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.out{background:#1e3b5c;color:#fff;padding:1rem;border-radius:12px;font-family:monospace;font-size:1.2rem;word-break:break-all;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:.6rem;font-weight:600}.row{display:flex;gap:6px}.row button{flex:1;background:#eaf0f9;color:#1e3b5c;border:none;padding:.6rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:1rem}input[type=range]{width:100%}.opt{display:flex;align-items:center;gap:8px;padding:.5rem;background:#f6f9fd;border-radius:10px;margin:.4rem 0;cursor:pointer;font-size:.9rem;color:#3e5a7a}.strength{height:6px;border-radius:3px;background:#e0e6ee;margin-top:.6rem;overflow:hidden}.strength div{height:100%;transition:.3s}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>🔐 Password Generator</h1><div class="out" id="out">Click Generate</div><div class="row"><button onclick="gen()">⚡ Generate</button><button onclick="copy()">📋 Copy</button></div><label>Length: <span id="len">16</span></label><input type="range" id="lenR" min="6" max="64" value="16"><div class="opt"><input type="checkbox" id="U" checked><label for="U">Uppercase</label></div><div class="opt"><input type="checkbox" id="L" checked><label for="L">Lowercase</label></div><div class="opt"><input type="checkbox" id="N" checked><label for="N">Numbers</label></div><div class="opt"><input type="checkbox" id="S" checked><label for="S">Symbols</label></div><div class="strength"><div id="bar" style="width:0%;background:#2e7d32"></div></div><p style="font-size:.8rem;color:#5a6f88;margin:.4rem 0 0;text-align:center" id="str">—</p><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);$("lenR").oninput=()=>$("len").textContent=$("lenR").value;function gen(){let c="";if($("U").checked)c+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";if($("L").checked)c+="abcdefghijklmnopqrstuvwxyz";if($("N").checked)c+="0123456789";if($("S").checked)c+="!@#$%^&*()-_=+[]{};:,.<>?";if(!c)return alert("Pick one type");const len=+$("lenR").value,arr=new Uint32Array(len);crypto.getRandomValues(arr);let o="";for(let i=0;i<len;i++)o+=c[arr[i]%c.length];$("out").textContent=o;rate(o)}function rate(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=16)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;const k=["#c62828","#c62828","#ef6c00","#f9a825","#2e7d32","#2e7d32","#1b5e20"][Math.min(s,6)];$("bar").style.width=(s/6*100)+"%";$("bar").style.background=k}function copy(){navigator.clipboard.writeText($("out").textContent).then(()=>{$("out").textContent="✅ Copied!";setTimeout(gen,700)})}gen();</script></body></html>
