<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Password Generator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);overflow-x:hidden}
.w{width:100%;max-width:520px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(16px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 10px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.4rem);text-align:center;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px;background:#eaf0f9;padding:4px;border-radius:12px}
.tabs button{flex:1;background:transparent;border:none;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;font-size:.82rem;color:#5a6f88;transition:.15s}
.tabs button.on{background:#fff;color:#1e3b5c;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.out{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;padding:14px;border-radius:13px;font-family:monospace;font-size:.95rem;word-break:break-all;text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-weight:600;box-shadow:0 6px 16px -6px rgba(30,59,92,.45)}
.row{display:flex;gap:6px}.row button{flex:1;background:#eaf0f9;color:#1e3b5c;border:none;padding:.6rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.82rem}
label{display:block;color:#5a6f88;font-size:.78rem;font-weight:600;margin-top:10px}
input[type=range]{width:100%;accent-color:#1e3b5c}
.opt{display:flex;align-items:center;gap:8px;padding:.45rem;background:#f6f9fd;border-radius:9px;margin:.3rem 0;cursor:pointer;font-size:.85rem;color:#3e5a7a}
.opt input{accent-color:#1e3b5c}
.strength{height:6px;border-radius:3px;background:#e0e6ee;margin-top:8px;overflow:hidden}
.strength div{height:100%;transition:.3s}
#str{font-size:.75rem;color:#5a6f88;margin:.35rem 0 0;text-align:center;font-weight:600}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🔐 Password Generator</h1>
<div class="tabs"><button class="on" onclick="mode('pw',this)">Password</button><button onclick="mode('pass',this)">Passphrase</button></div>
<div class="out" id="out">Click Generate</div>
<div class="row"><button onclick="gen()">⚡ Generate</button><button onclick="copy()">📋 Copy</button></div>
<div id="pwOpts">
<label>Length: <span id="len">16</span></label><input type="range" id="lenR" min="6" max="64" value="16">
<div class="opt"><input type="checkbox" id="U" checked><label for="U">Uppercase</label></div>
<div class="opt"><input type="checkbox" id="L" checked><label for="L">Lowercase</label></div>
<div class="opt"><input type="checkbox" id="N" checked><label for="N">Numbers</label></div>
<div class="opt"><input type="checkbox" id="S" checked><label for="S">Symbols</label></div>
<div class="opt"><input type="checkbox" id="XA"><label for="XA">Exclude ambiguous (0 O l 1 I)</label></div>
</div>
<div id="passOpts" style="display:none"><label>Words: <span id="wlen">4</span></label><input type="range" id="wlenR" min="3" max="8" value="4"></div>
<div class="strength"><div id="bar" style="width:0%;background:#2e7d32"></div></div>
<p id="str">—</p>
</div>
<script>
const $=i=>document.getElementById(i);let m="pw";
const WORDS=["apple","river","tiger","cloud","stone","light","brave","music","ocean","flower","happy","mango","pencil","rocket","silver","sunset","travel","winter","yellow","zebra","banana","candle","dragon","forest","garden","hunter","island","jungle","kettle","ladder","market","napkin","orange","planet","quiet","rabbit","school","toffee","umbrella","violet","wallet","yogurt"];
$("lenR").oninput=()=>$("len").textContent=$("lenR").value;
$("wlenR").oninput=()=>$("wlen").textContent=$("wlenR").value;
function mode(m2,btn){m=m2;document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");$("pwOpts").style.display=m==="pw"?"block":"none";$("passOpts").style.display=m==="pass"?"block":"none";gen()}
function gen(){
  if(m==="pass"){const n=+$("wlenR").value;const ws=[];for(let i=0;i<n;i++)ws.push(WORDS[Math.floor(Math.random()*WORDS.length)]);const o=ws.join("-");$("out").textContent=o;rate(o);return}
  let c="";if($("U").checked)c+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";if($("L").checked)c+="abcdefghijklmnopqrstuvwxyz";if($("N").checked)c+="0123456789";if($("S").checked)c+="!@#$%^&*()-_=+[]{};:,.<>?";if($("XA").checked)c=c.replace(/[0Ol1I]/g,"");
  if(!c)return alert("Select at least one character type");
  const len=+$("lenR").value,arr=new Uint32Array(len);crypto.getRandomValues(arr);
  let o="";for(let i=0;i<len;i++)o+=c[arr[i]%c.length];
  $("out").textContent=o;rate(o);
}
function rate(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=16)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
  const k=["#c62828","#c62828","#ef6c00","#f9a825","#2e7d32","#2e7d32","#1b5e20"][Math.min(s,6)];
  $("bar").style.width=(s/6*100)+"%";$("bar").style.background=k;
  $("str").textContent=["Very Weak","Very Weak","Weak","Fair","Good","Strong","Very Strong"][Math.min(s,6)];
}
function copy(){navigator.clipboard.writeText($("out").textContent).then(()=>{$("out").textContent="✅ Copied!";setTimeout(gen,700)})}
gen();
</script></body></html>
