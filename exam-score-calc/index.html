body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px)}

.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 4px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.45rem);text-align:center;font-weight:700}
.sub{text-align:center;color:#5a6f88;font-size:.78rem;margin-bottom:12px}
label{display:block;color:#5a6f88;font-size:.7rem;font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:10px 13px;border:1px solid #d5e0ed;border-radius:11px;box-sizing:border-box;font-size:.88rem;background:#fff;margin-top:4px}
input:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.btn{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:12px;font-size:.9rem;box-shadow:0 8px 20px -6px rgba(30,59,92,.5)}
.res{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:14px;padding:16px;margin-top:12px;text-align:center;display:none}
.res .big{font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700;margin:.2rem 0}
.res .label{font-size:.7rem;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:.72rem}
.grid b{display:block;font-size:1rem;margin-top:2px}
.share{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.share a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:600}

</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickTools">
<link rel="apple-touch-icon" href="/icon-192.png">
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🎯 Negative Marking Calculator</h1>
<p class="sub">Calculate raw score, deductions & accuracy for SSC / UPSC / IBPS.</p>
<label>Total Questions</label><input type="number" id="tot" value="100">
<label>Correct Answers</label><input type="number" id="cor" value="75">
<label>Wrong Answers</label><input type="number" id="wr" value="15">
<label>Marks per Question</label><input type="number" id="mpq" value="2" step="0.1">
<label>Negative Marking Penalty (per wrong)</label><input type="number" id="neg" value="0.5" step="0.01">
<button class="btn" onclick="calc()">Calculate Score</button>
<div class="res" id="res">
<div class="label">Final Score</div>
<div class="big" id="score">—</div>
<div class="grid">
<div>Raw<b id="raw">—</b></div>
<div>Penalty<b id="pen">—</b></div>
<div>Accuracy<b id="acc">—</b></div>
</div>
</div>
<div class="share">
<span style="font-size:.72rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20Score%20Calc%3A%20https://unknownuniversem-blip.github.io/exam-score-calc/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/exam-score-calc/?utm_source=telegram&utm_medium=share" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
function calc(){
  const c=+$("cor").value,w=+$("wr").value,mpq=+$("mpq").value,neg=+$("neg").value;
  const raw=c*mpq;
  const pen=w*neg;
  const score=raw-pen;
  const acc=c/(c+w)*100;
  $("score").textContent=score.toFixed(2);
  $("raw").textContent=raw.toFixed(2);
  $("pen").textContent=pen.toFixed(2);
  $("acc").textContent=acc.toFixed(1)+"%";
  $("res").style.display="block";
}
calc();
</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body></html>
