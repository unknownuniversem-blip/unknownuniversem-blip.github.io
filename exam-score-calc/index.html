<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Negative Marking Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:480px;margin:auto;background:#0f172a;padding:24px;border-radius:12px;border:1px solid #1e293b;text-align:left}
    input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff}
    .score{font-size:2.4rem;font-weight:900;color:#38bdf8;text-align:center;margin-top:14px}
  </style>
</head>
<body>
  <div class="box">
    <h3 style="text-align:center;color:#38bdf8">🎯 Negative Marking Calculator</h3>
    <label style="font-size:0.8rem;color:#94a3b8">Exam Pattern</label>
    <select id="p" onchange="preset()">
      <option value="2,0.5">SSC CGL/CHSL (+2, -0.50)</option>
      <option value="1,0.33">Railway RRB (+1, -0.33)</option>
      <option value="1,0.25">Banking IBPS (+1, -0.25)</option>
      <option value="2,0.66">UPSC Prelims (+2, -0.66)</option>
    </select>
    <label style="font-size:0.8rem;color:#94a3b8">Correct Answers</label>
    <input type="number" id="cor" value="70" oninput="calc()">
    <label style="font-size:0.8rem;color:#94a3b8">Wrong Answers</label>
    <input type="number" id="wrg" value="12" oninput="calc()">
    <div class="score" id="res">134.00</div>
    <div style="text-align:center;color:#94a3b8;font-size:0.85rem" id="acc">Accuracy: 85.4%</div>
  </div>
  <script>
    function calc(){
      const [pos, neg] = document.getElementById('p').value.split(',').map(Number);
      const c = parseInt(document.getElementById('cor').value)||0;
      const w = parseInt(document.getElementById('wrg').value)||0;
      const net = (c * pos) - (w * neg);
      const acc = (c+w) > 0 ? ((c/(c+w))*100).toFixed(1) : 0;
      document.getElementById('res').innerText = net.toFixed(2);
      document.getElementById('acc').innerText = "Accuracy: " + acc + "% | Penalty: -" + (w*neg).toFixed(2);
    }
    function preset(){ calc(); }
    calc();
  </script>
</body>
</html>
