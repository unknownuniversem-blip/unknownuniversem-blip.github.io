<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Age Eligibility Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:480px;margin:auto;background:#0f172a;padding:24px;border-radius:12px;border:1px solid #1e293b;text-align:left}
    label{font-size:0.8rem;color:#94a3b8;display:block;margin-top:10px}
    input,select,button{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff}
    button{background:#38bdf8;color:#070c18;font-weight:700;margin-top:18px;cursor:pointer}
    .res{margin-top:18px;padding:12px;background:#070c18;border-radius:8px;font-size:0.95rem}
  </style>
</head>
<body>
  <div class="box">
    <h3 style="color:#38bdf8;text-align:center">🎂 Age Eligibility Calculator</h3>
    <label>Date of Birth</label>
    <input type="date" id="dob" value="2001-05-15">
    <label>Exam Cutoff Reference Date (e.g. 01-08-2024)</label>
    <input type="date" id="ref" value="2024-08-01">
    <label>Category (Age Relaxation)</label>
    <select id="cat">
      <option value="0">General / EWS (No relaxation)</option>
      <option value="3">OBC (+3 Years)</option>
      <option value="5">SC / ST (+5 Years)</option>
      <option value="10">PwD (+10 Years)</option>
    </select>
    <button onclick="calculateAge()">Calculate Exact Age</button>
    <div id="res" class="res">Fill dates and tap calculate.</div>
  </div>
  <script>
    function calculateAge(){
      const d1 = new Date(document.getElementById('dob').value);
      const d2 = new Date(document.getElementById('ref').value);
      if(isNaN(d1) || isNaN(d2)) return;
      let y = d2.getFullYear() - d1.getFullYear();
      let m = d2.getMonth() - d1.getMonth();
      let d = d2.getDate() - d1.getDate();
      if(d < 0){ m--; d += 30; }
      if(m < 0){ y--; m += 12; }
      const relax = parseInt(document.getElementById('cat').value);
      document.getElementById('res').innerHTML = `
        <b>Exact Age:</b> <span style="color:#38bdf8">${y} Years, ${m} Months, ${d} Days</span><br>
        <span style="font-size:0.8rem;color:#94a3b8">Category Relaxation Added: +${relax} Years</span>`;
    }
  </script>
</body>
</html>
