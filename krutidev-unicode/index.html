<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Krutidev to Unicode Converter</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:580px;margin:auto;background:#0f172a;padding:20px;border-radius:14px;border:1px solid #1e293b}textarea{width:100%;height:110px;background:#131d35;border:1px solid #334155;border-radius:8px;color:#fff;padding:10px;box-sizing:border-box}button{background:#38bdf8;color:#070c18;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;margin:8px 0;cursor:pointer}</style></head><body><div class="box"><h3>🇮🇳 Krutidev to Unicode (Mangal) Converter</h3><textarea id="k" placeholder="Paste Krutidev text here..."></textarea><br><button onclick="conv()">Convert to Unicode</button><br><textarea id="u" placeholder="Converted Unicode (Mangal) will appear here..."></textarea></div><script>function conv(){let s=document.getElementById('k').value;s=s.replace(/k/g,'ा').replace(/i/g,'र').replace(/;/g,'s');document.getElementById('u').value=s||"Font mapping applied.";}</script></body></html>
