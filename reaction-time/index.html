<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Reaction Time Tester</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.pad{max-width:480px;height:220px;margin:20px auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:bold;cursor:pointer;user-select:none;background:#ef4444;color:#fff}</style></head><body><h3>⚡ Reflex Reaction Time Tester</h3><p style="color:#94a3b8;font-size:0.85rem">Tap the red box when it turns green</p><div class="pad" id="p" onclick="tap()">Wait for Green...</div><script>let s=null,t=null;function arm(){document.getElementById('p').style.background='#ef4444';document.getElementById('p').innerText='Wait for Green...';t=setTimeout(()=>{document.getElementById('p').style.background='#22c55e';document.getElementById('p').innerText='TAP NOW!';s=new Date();},1500+Math.random()*2500);}function tap(){if(s){const ms=new Date()-s;document.getElementById('p').innerText=`Your Reflex: ${ms} ms (Tap to retry)`;s=null;document.getElementById('p').style.background='#0284c7';}else{clearTimeout(t);arm();}}arm();</script></body></html>
