<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Formula Vault · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;padding:clamp(8px,1.5vw,16px)}
.w{width:100%;max-width:820px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 10px;color:#1e2b3c;font-size:clamp(1.2rem,3.6vw,1.5rem);text-align:center;font-weight:700}
input.search{width:100%;padding:11px 14px;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-bottom:10px;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tab{background:#eaf0f9;color:#1e3b5c;border:none;padding:.4rem .8rem;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.15s}
.tab.on{background:#1e3b5c;color:#fff}
.count{font-size:.72rem;color:#5a6f88;margin-bottom:8px}
.f{background:linear-gradient(145deg,#f6f9fd,#eef4fa);padding:.7rem .9rem;border-radius:11px;border-left:4px solid #1e3b5c;margin-bottom:5px}
.f b{display:block;color:#1e2b3c;font-size:.82rem;margin-bottom:.2rem}
.f code{background:#fff;padding:.35rem .55rem;border-radius:6px;font-size:.85rem;color:#1e3b5c;display:block;font-family:monospace;word-break:break-word}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>📐 Formula Vault</h1>
<input class="search" id="q" placeholder="🔍 Search 150+ formulas...">
<div class="tabs" id="tabs"></div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>
<script>
const D={
Physics:[["v = u + at","Velocity after time t"],["s = ut + ½at²","Distance in time t"],["v² = u² + 2as","Velocity–distance"],["F = ma","Newton's 2nd law"],["W = F·d·cosθ","Work done"],["KE = ½mv²","Kinetic energy"],["PE = mgh","Potential energy"],["P = W/t","Power"],["ρ = m/V","Density"],["Q = mcΔT","Heat energy"],["p = mv","Momentum"],["a = Δv/Δt","Acceleration"],["T = 1/f","Period from frequency"],["ω = 2πf","Angular frequency"],["E = hf","Photon energy"],["F = G·m₁m₂/r²","Gravitation"],["I = V/R","Ohm's law"],["P = VI","Electrical power"],["R = ρL/A","Resistance"],["C = Q/V","Capacitance"]],
Math:[["(a+b)² = a² + 2ab + b²","Square of sum"],["(a-b)² = a² - 2ab + b²","Square of diff"],["a²-b² = (a+b)(a-b)","Diff of squares"],["(a+b)³ = a³+3a²b+3ab²+b³","Cube of sum"],["(a-b)³ = a³-3a²b+3ab²-b³","Cube of diff"],["a³+b³ = (a+b)(a²-ab+b²)","Sum of cubes"],["a³-b³ = (a-b)(a²+ab+b²)","Diff of cubes"],["A = πr²","Circle area"],["C = 2πr","Circumference"],["A = l·w","Rectangle area"],["A = ½·b·h","Triangle area"],["A = ½·d₁·d₂","Rhombus area"],["V = l·w·h","Cuboid volume"],["V = ⁴⁄₃πr³","Sphere volume"],["V = πr²h","Cylinder volume"],["V = ⅓πr²h","Cone volume"],["sin²θ + cos²θ = 1","Pythagorean trig"],["tan θ = sin θ/cos θ","Tangent identity"],["sin 2θ = 2 sin θ cos θ","Double angle sine"],["cos 2θ = 1-2 sin²θ","Double angle cosine"],["Sum 1..n = n(n+1)/2","Natural sum"],["Sum 1²..n² = n(n+1)(2n+1)/6","Square sum"],["x = (-b ± √(b²-4ac))/(2a)","Quadratic roots"],["D = √((x₂-x₁)²+(y₂-y₁)²)","Distance 2D"],["A = ½|x₁(y₂-y₃)+x₂(y₃-y₁)+x₃(y₁-y₂)|","Triangle coords"]],
Chemistry:[["PV = nRT","Ideal gas law"],["M = n/V","Molarity"],["pH = -log[H⁺]","pH from H+"],["pOH = 14 - pH","pOH relation"],["N = n·N_A","Avogadro count"],["% yield = (actual/theoretical)×100","Reaction yield"],["M₁V₁ = M₂V₂","Dilution"],["ΔT = K·m","Boiling/freezing pt"],["Kc = [P]/[R]","Equilibrium const"]],
Reasoning:[["nPr = n!/(n-r)!","Permutations"],["nCr = n!/(r!(n-r)!)","Combinations"],["P(A∪B) = P(A)+P(B)-P(A∩B)","Union probability"],["P(A∩B) = P(A)·P(B)","Independent"],["P(A|B) = P(A∩B)/P(B)","Conditional"],["Expected = Σ(x·P(x))","Expected value"],["Time = Distance/Speed","Basic speed"],["Avg speed = Total/Times","Average speed"],["Train: (L₁+L₂)/(S₁+S₂)","Relative speed"],["Work: 1/t = 1/t₁ + 1/t₂","Combined work"]],
English:[["S + V + O","Simple order"],["Active: S+V+O","Active voice"],["Passive: O+be+V3+by S","Passive voice"],["Direct: He said, \"...\"","Direct speech"],["Indirect: He said that...","Indirect speech"],["a/an + consonant/vowel","Article rule"],["Comparative: adj+er / more+adj","Comparison"],["Superlative: adj+est / most+adj","Highest degree"]],
Geography:[["Latitude ↔ Temperature","Equator→Poles"],["Longitude ↔ Time","15° = 1 hour"],["GMT ± hours = Local","Time zones"],["Rainfall = Precip - Evap","Water balance"],["Density = Pop/Area","Population density"],["Birth rate = Births/1000","CBR"],["Death rate = Deaths/1000","CDR"]],
GK:[["108th Amendment","Panchayati Raj"],["73rd & 74th","Local bodies"],["Article 21A","Right to Education"],["Article 32","Writ remedies"],["Article 370","J&K (removed 2019)"],["Article 356","President's Rule"],["Fundamental Duties","Article 51A"],["DPSP","Part IV (36–51)"]],
Economics:[["GDP = C + I + G + (X-M)","National income"],["Inflation = (P₁-P₀)/P₀ × 100","Inflation rate"],["SI = P·R·T/100","Simple interest"],["A = P(1+R/n)^(nt)","Compound interest"],["EMI = P·R·(1+R)^N / ((1+R)^N -1)","EMI"],["Elasticity = %ΔQ/%ΔP","Price elasticity"],["Money Mult = 1/CRR","Credit creation"]]
};
const $=i=>document.getElementById(i);
let cur="Physics";
function r(){
  const q=$("q").value.toLowerCase();
  $("tabs").innerHTML=Object.keys(D).map(k=>`<button class="tab${k===cur?" on":""}" data-k="${k}">${k}</button>`).join("");
  let it=q?Object.values(D).flat().filter(f=>f[0].toLowerCase().includes(q)||f[1].toLowerCase().includes(q)):D[cur];
  $("count").textContent="Showing "+it.length+" formula"+(it.length===1?"":"s");
  $("list").innerHTML=it.length?it.map(f=>`<div class="f"><b>${f[1]}</b><code>${f[0]}</code></div>`).join(""):"<p style=\"color:#8899aa;text-align:center;padding:1.5rem\">No matches</p>";
}
$("tabs").onclick=e=>{if(e.target.dataset.k){cur=e.target.dataset.k;r()}};
$("q").oninput=r;r();
</script></body></html>
