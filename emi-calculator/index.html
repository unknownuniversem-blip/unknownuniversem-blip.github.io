<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>EMI Calculator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);overflow:hidden}
.w{width:100%;max-width:520px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(16px,2.5vw,26px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative;max-height:96vh;max-height:96dvh;overflow-y:auto}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 10px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.4rem);text-align:center;font-weight:700}
label{display:block;color:#5a6f88;font-size:.72rem;font-weight:600;margin-top:8px;text-transform:uppercase}
input{width:100%;padding:clamp(8px,1.8vw,11px) 14px;border:1px solid #d5e0ed;border-radius:11px;box-sizing:border-box;font-size:clamp(.85rem,2.2vw,.95rem);background:#fff;font-family:inherit}
input:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.out{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:14px;padding:clamp(12px,2vw,18px);margin-top:12px;text-align:center}
.big{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:700;margin:.15rem 0}
.row{display:flex;justify-content:space-around;font-size:.72rem;opacity:.9;margin-top:.4rem}
.row b{display:block;font-size:clamp(.95rem,2.5vw,1.15rem)}
details{margin-top:12px}
summary{cursor:pointer;color:#1e3b5c;font-weight:600;font-size:.82rem;padding:8px;background:#eaf0f9;border-radius:10px;text-align:center;list-style:none}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.72rem}
th,td{padding:.4rem .25rem;text-align:right;border-bottom:1px solid #eef4fa}
th{background:#eaf0f9;color:#1e3b5c;text-align:center;font-weight:600}
th:first-child,td:first-child{text-align:center}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>💰 EMI Calculator</h1>
<label>Loan Amount (₹)</label><input type="number" id="p" value="500000" min="1000">
<label>Interest Rate (% / year)</label><input type="number" id="r" value="8.5" step="0.1" min="0">
<label>Tenure (years)</label><input type="number" id="n" value="5" min="1" max="40">
<div class="out"><div style="font-size:.72rem;opacity:.85">Monthly EMI</div><div class="big" id="emi">₹0</div><div class="row"><div>Interest<b id="ti">₹0</b></div><div>Total<b id="tp">₹0</b></div></div></div>
<details><summary>📋 View yearly amortization schedule</summary><div id="sched"></div></details>
</div>
<script>
const $=i=>document.getElementById(i);
function f(v){return"₹"+Math.round(v).toLocaleString("en-IN")}
function calc(){
  const P=+$("p").value||0,R=+$("r").value/1200,N=+$("n").value*12;
  if(!P||!N)return;
  const emi=R?P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1):P/N;
  const tp=emi*N,ti=tp-P;
  $("emi").textContent=f(emi);$("ti").textContent=f(ti);$("tp").textContent=f(tp);
  let bal=P,rows="",yi=0,yp=0,yr=1;
  for(let i=1;i<=N;i++){
    const int=bal*R,pri=emi-int;bal-=pri;yi+=int;yp+=pri;
    if(i%12===0||i===N){rows+=`<tr><td>${yr}</td><td>${f(yp)}</td><td>${f(yi)}</td><td>${f(bal)}</td></tr>`;yr++;yi=0;yp=0}
  }
  $("sched").innerHTML=`<table><thead><tr><th>Yr</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
}
["p","r","n"].forEach(id=>$(id).oninput=calc);calc();
</script></body></html>
