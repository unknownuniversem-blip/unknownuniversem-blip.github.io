<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>"><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;padding:20px;box-sizing:border-box}.w{max-width:640px;margin:20px auto;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.8rem}input{width:100%;padding:.8rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}.out{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:1.2rem;padding:1.4rem;margin-top:1rem;text-align:center}.big{font-size:2rem;font-weight:700;margin:.3rem 0}.row{display:flex;justify-content:space-around;font-size:.8rem;opacity:.9;margin-top:.8rem}.row b{display:block;font-size:1.1rem;margin-top:.2rem}table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.8rem}th,td{padding:.5rem .3rem;text-align:right;border-bottom:1px solid #eef4fa}th{background:#eaf0f9;color:#1e3b5c;font-weight:600;text-align:center}th:first-child,td:first-child{text-align:center}details{margin-top:1rem}summary{cursor:pointer;color:#1e3b5c;font-weight:600;font-size:.9rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>💰 EMI Calculator</h1><label>Loan (₹)</label><input type="number" id="p" value="500000"><label>Rate %</label><input type="number" id="r" value="8.5" step="0.1"><label>Years</label><input type="number" id="n" value="5"><div class="out"><div>Monthly EMI</div><div class="big" id="emi">₹0</div><div class="row"><div>Interest<b id="ti">₹0</b></div><div>Total<b id="tp">₹0</b></div></div></div><details><summary>📋 View amortization schedule (yearly)</summary><div id="sched"></div></details><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);function f(v){return"₹"+Math.round(v).toLocaleString("en-IN")}function calc(){const P=+$("p").value||0,R=+$("r").value/1200,N=+$("n").value*12;if(!P||!N)return;const emi=R?P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1):P/N;const tp=emi*N,ti=tp-P;$("emi").textContent=f(emi);$("ti").textContent=f(ti);$("tp").textContent=f(tp);let bal=P,rows="",yearInt=0,yearPrin=0,yr=1;for(let i=1;i<=N;i++){const int=bal*R,pri=emi-int;bal-=pri;yearInt+=int;yearPrin+=pri;if(i%12===0||i===N){rows+=`<tr><td>${yr}</td><td>${f(yearPrin)}</td><td>${f(yearInt)}</td><td>${f(bal)}</td></tr>`;yr++;yearInt=0;yearPrin=0}}const years=Math.ceil(N/12);$("sched").innerHTML=`<table><thead><tr><th>Yr</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`}["p","r","n"].forEach(id=>$(id).oninput=calc);calc();</script></body></html>
