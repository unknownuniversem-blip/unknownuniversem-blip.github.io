<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Loan EMI Calculator</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b;text-align:left}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}.res{margin-top:14px;padding:12px;background:#070c18;border-radius:8px;text-align:center;font-size:1.4rem;color:#38bdf8;font-weight:bold}</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body><div class="box"><h3 style="text-align:center;color:#38bdf8">💰 Loan EMI Calculator</h3><label style="font-size:0.8rem;color:#94a3b8">Loan Amount (₹)</label><input type="number" id="p" value="500000" oninput="calc()"><label style="font-size:0.8rem;color:#94a3b8">Interest Rate (% Annual)</label><input type="number" id="r" value="8.5" step="0.1" oninput="calc()"><label style="font-size:0.8rem;color:#94a3b8">Tenure (Months)</label><input type="number" id="n" value="36" oninput="calc()"><div class="res" id="emi">EMI: ₹15,780/mo</div></div><script>function calc(){const p=parseFloat(document.getElementById('p').value)||0;const r=(parseFloat(document.getElementById('r').value)||0)/(12*100);const n=parseFloat(document.getElementById('n').value)||1;const emi=p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);document.getElementById('emi').innerText="EMI: ₹"+Math.round(emi).toLocaleString()+"/mo";}calc();</script></body></html>
