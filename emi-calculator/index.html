<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:520px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.8rem}input{width:100%;padding:.8rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}.out{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:1.2rem;padding:1.4rem;margin-top:1rem;text-align:center}.big{font-size:2rem;font-weight:700;margin:.3rem 0}.row{display:flex;justify-content:space-around;font-size:.8rem;opacity:.9;margin-top:.8rem}.row b{display:block;font-size:1.1rem;margin-top:.2rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>💰 EMI Calculator</h1><label>Loan (₹)</label><input type="number" id="p" value="500000"><label>Rate %</label><input type="number" id="r" value="8.5" step="0.1"><label>Years</label><input type="number" id="n" value="5"><div class="out"><div>Monthly EMI</div><div class="big" id="emi">₹0</div><div class="row"><div>Interest<b id="ti">₹0</b></div><div>Total<b id="tp">₹0</b></div></div></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);function calc(){const P=+$("p").value||0,R=+$("r").value/1200,N=+$("n").value*12;if(!P||!N)return;const emi=R?P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1):P/N;const tp=emi*N,ti=tp-P;const f=v=>"₹"+Math.round(v).toLocaleString("en-IN");$("emi").textContent=f(emi);$("ti").textContent=f(ti);$("tp").textContent=f(tp)}["p","r","n"].forEach(id=>$(id).oninput=calc);calc();</script></body></html>
