<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💯</text></svg>"><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;padding:20px;box-sizing:border-box}.w{max-width:560px;margin:20px auto;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.box{background:#f6f9fd;border-radius:1rem;padding:1rem;margin:.8rem 0}.box h3{margin:0 0 .6rem;color:#3e5a7a;font-size:.9rem}.box input{width:100%;padding:.7rem;border:1px solid #d5e0ed;border-radius:10px;margin:.2rem 0;box-sizing:border-box}.box .out{background:#1e3b5c;color:#fff;padding:.9rem;border-radius:10px;text-align:center;font-size:1.3rem;font-weight:700;margin-top:.5rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>💯 Percentage Calculator</h1><div class="box"><h3>X% of Y</h3><input id="p1" type="number" placeholder="X"><input id="p2" type="number" placeholder="Y"><div class="out" id="o1">—</div></div><div class="box"><h3>X is what % of Y</h3><input id="p3" type="number" placeholder="X"><input id="p4" type="number" placeholder="Y"><div class="out" id="o2">—</div></div><div class="box"><h3>% change X → Y</h3><input id="p5" type="number" placeholder="From"><input id="p6" type="number" placeholder="To"><div class="out" id="o3">—</div></div><div class="box"><h3>Marks Obtained / Total</h3><input id="p7" type="number" placeholder="Obtained"><input id="p8" type="number" placeholder="Total"><div class="out" id="o4">—</div></div><div class="box"><h3>GST / Tax Calculator (₹)</h3><input id="g1" type="number" placeholder="Amount"><input id="g2" type="number" placeholder="GST % e.g. 18"><div class="out" id="o5">—</div></div><div class="box"><h3>Discount Calculator</h3><input id="d1" type="number" placeholder="Price"><input id="d2" type="number" placeholder="Discount %"><div class="out" id="o6">—</div></div><div class="box"><h3>Tip Calculator</h3><input id="t1" type="number" placeholder="Bill amount"><input id="t2" type="number" placeholder="Tip %"><div class="out" id="o7">—</div></div><div class="box"><h3>Reverse % (X% of ? = Y)</h3><input id="r1" type="number" placeholder="X %"><input id="r2" type="number" placeholder="Y"><div class="out" id="o8">—</div></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);function f(v){return isFinite(v)?Number(v.toFixed(2)):"—"}function upd(){const g=id=>parseFloat($(id).value);$("o1").textContent=f(g("p1")*g("p2")/100);$("o2").textContent=isFinite(g("p3")/g("p4"))?f(g("p3")/g("p4")*100)+" %":"—";const fr=g("p5"),to=g("p6");$("o3").textContent=fr?f((to-fr)/fr*100)+" %":"—";$("o4").textContent=isFinite(g("p7")/g("p8"))?f(g("p7")/g("p8")*100)+" %":"—";const ga=g("g1"),gr=g("g2");if(isFinite(ga)&&isFinite(gr)){$("o5").textContent="Base ₹"+f(ga)+" + GST ₹"+f(ga*gr/100)+" = ₹"+f(ga*(1+gr/100))}else $("o5").textContent="—";const dp=g("d1"),dr=g("d2");if(isFinite(dp)&&isFinite(dr)){$("o6").textContent="Save ₹"+f(dp*dr/100)+" → Pay ₹"+f(dp*(1-dr/100))}else $("o6").textContent="—";const tb=g("t1"),tr=g("t2");if(isFinite(tb)&&isFinite(tr)){$("o7").textContent="Tip ₹"+f(tb*tr/100)+" → Total ₹"+f(tb*(1+tr/100))}else $("o7").textContent="—";const rx=g("r1"),ry=g("r2");$("o8").textContent=rx?f(ry/(rx/100)):"—"}["p1","p2","p3","p4","p5","p6","p7","p8","g1","g2","d1","d2","t1","t2","r1","r2"].forEach(id=>$(id).oninput=upd);</script></body></html>
