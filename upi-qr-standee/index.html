<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>UPI QR Standee Maker</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:440px;margin:auto;background:#0f172a;padding:20px;border-radius:14px;border:1px solid #1e293b}input,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}button{background:#f59e0b;color:#000;font-weight:bold;cursor:pointer}#print-standee{display:none;background:#fff;color:#000;padding:30px;border:2px solid #000;width:300px;margin:20px auto;border-radius:12px}</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body><div class="box"><h3>💳 UPI Countertop Standee Maker</h3><input type="text" id="vpa" placeholder="Shop UPI ID (e.g. name@okhdfcbank)"><input type="text" id="shop" placeholder="Shop Name"><button onclick="makeStandee()">Generate Printable Standee</button></div><div id="print-standee"><h2 id="st-name" style="margin-bottom:10px">Shop Name</h2><p style="font-size:0.8rem">Scan & Pay Using Any UPI App</p><img id="st-qr" src="" style="width:180px;height:180px;margin:15px 0"><p id="st-vpa" style="font-weight:bold;font-size:0.85rem">upi@id</p><button onclick="window.print()" style="background:#000;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer">Print Standee</button></div><script>function makeStandee(){const v=document.getElementById('vpa').value.trim();const s=document.getElementById('shop').value.trim();if(!v) return alert('Enter UPI ID');document.getElementById('st-name').innerText=s||"Payment Counter";document.getElementById('st-vpa').innerText=v;const upiUri = `upi://pay?pa=${v}&pn=${encodeURIComponent(s)}`;document.getElementById('st-qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(upiUri);document.getElementById('print-standee').style.display='block';}</script></body></html>
