<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compressor · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>"><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:600px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.drop{border:2px dashed #a9bed4;border-radius:1.2rem;padding:2rem;text-align:center;color:#5a6f88;cursor:pointer;background:#f6f9fd}.drop:hover{border-color:#1e3b5c}button{background:#1e3b5c;color:#fff;border:none;padding:.8rem;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:1rem}button:disabled{opacity:.4}.info{background:#e8f5e9;color:#2e7d32;padding:1rem;border-radius:12px;margin:1rem 0;display:none;font-size:.9rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:1rem}select{width:100%;padding:.7rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>📄 PDF Compressor</h1><p style="color:#5a6f88;font-size:.9rem">Compress PDFs in your browser. Files stay on your device.</p><div class="drop" id="drop">📁 Click or drop a PDF</div><input type="file" id="file" accept="application/pdf" hidden><div class="info" id="info"></div><label>Compression Level</label><select id="lvl"><option value="light">Light (fastest, least shrink)</option><option value="medium" selected>Medium (balanced)</option><option value="high">High (smallest file)</option></select><button id="go" disabled>⚡ Compress PDF</button><a href="../">← Back</a></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const $=i=>document.getElementById(i);let b=null,n="";$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};$("file").onchange=e=>load(e.target.files[0]);async function load(f){if(!f||f.type!=="application/pdf")return alert("Select a PDF");n=f.name;b=new Uint8Array(await f.arrayBuffer());$("info").style.display="block";$("info").textContent="✅ "+f.name+" — "+(f.size/1024).toFixed(1)+" KB";$("go").disabled=false}$("go").onclick=async()=>{if(!b)return;try{$("go").textContent="⏳...";$("go").disabled=true;const lvl=$("lvl").value;const doc=await PDFLib.PDFDocument.load(b,{ignoreEncryption:true});const opts={useObjectStreams:lvl!=="light"};const o=await doc.save(opts);const bl=new Blob([o],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=n.replace(/\.pdf$/i,"")+"-compressed.pdf";a.click();$("info").textContent="✅ Done! "+(bl.size/1024).toFixed(1)+" KB (was "+(b.length/1024).toFixed(1)+" KB) — "+Math.round((1-bl.size/b.length)*100)+"% smaller"}catch(e){alert("Failed: "+e.message)}finally{$("go").textContent="⚡ Compress PDF";$("go").disabled=false}};</script></body></html>
