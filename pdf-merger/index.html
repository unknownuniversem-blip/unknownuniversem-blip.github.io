<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Client-Side PDF Merger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:480px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}
    input,button{width:100%;margin:10px 0;padding:12px;border-radius:8px;border:none}
    button{background:#0284c7;color:#fff;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h3>📑 Document PDF Merger (In-Browser)</h3>
    <p style="color:#94a3b8;font-size:0.85rem">100% private: Certificate scans never leave your device.</p>
    <input type="file" id="f" multiple accept="application/pdf">
    <button onclick="alert('Select your PDF scans to combine for exam submission.')">Merge Documents</button>
  </div>
</body>
</html>
