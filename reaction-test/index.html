<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Test · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#1e2b3c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;color:#fff}.w{max-width:520px;width:100%;background:#25344a;border-radius:2rem;padding:2rem;text-align:center}h1{margin:0 0 .5rem;font-size:1.5rem}.pad{aspect-ratio:1.4;border-radius:1.5rem;background:#3d526e;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-size:1.4rem;font-weight:700;transition:.15s}.pad.wait{background:#c62828}.pad.go{background:#f9a825;color:#1e2b3c;font-size:2rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:1rem}.st{background:#3d526e;padding:.8rem;border-radius:12px}.st b{display:block;font-size:1.3rem}.st small{font-size:.7rem;color:#a0b2c8}a{display:block;text-align:center;margin-top:1rem;color:#a0b2c8;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>⚡ Reaction Time</h1><div class="pad wait" id="pad">Wait for GREEN...</div><div class="stats"><div class="st"><b id="last">—</b><small>Last (ms)</small></div><div class="st"><b id="best">—</b><small>Best</small></div><div class="st"><b id="tries">0</b><small>Tries</small></div></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);let state="wait",t0=0,best=null,tries=0,timer=null;function reset(){state="wait";$("pad").className="pad wait";$("pad").textContent="Wait for GREEN...";clearTimeout(timer);timer=setTimeout(go,1500+Math.random()*2500)}function go(){state="go";t0=performance.now();$("pad").className="pad go";$("pad").textContent="CLICK!"}function click(){if(state==="wait"){clearTimeout(timer);$("pad").textContent="Too early!";state="early";return}if(state==="early"){reset();return}if(state==="go"){const t=Math.round(performance.now()-t0);if(!best||t<best)best=t;tries++;$("last").textContent=t;$("best").textContent=best;$("tries").textContent=tries;$("pad").className="pad";$("pad").textContent=t+" ms — click for next";state="wait2";return}if(state==="wait2")reset()}$("pad").onclick=click;reset();</script></body></html>
