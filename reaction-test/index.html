<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Reaction Test · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#25344a,#1e2b3c 70%);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);color:#fff;overflow:hidden}
.w{width:100%;max-width:480px;background:rgba(45,64,90,.85);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,22px);text-align:center;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.hub{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.15)}
h1{margin:4px 0 10px;font-size:clamp(1.1rem,3.5vw,1.35rem);font-weight:700}
.pad{aspect-ratio:1.3;border-radius:18px;background:#3d526e;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-size:clamp(1rem,3.2vw,1.3rem);font-weight:700;transition:.15s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.pad.wait{background:linear-gradient(135deg,#c62828,#8f1e1e)}
.pad.go{background:linear-gradient(135deg,#f9a825,#e68900);color:#1e2b3c;font-size:clamp(1.4rem,4.5vw,2rem)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.st{background:rgba(255,255,255,.08);padding:.6rem .2rem;border-radius:11px;border:1px solid rgba(255,255,255,.08)}
.st b{display:block;font-size:clamp(.85rem,2.5vw,1.05rem)}
.st small{font-size:.6rem;color:#a0b2c8;text-transform:uppercase;letter-spacing:.05em}
.hist{margin-top:10px;background:rgba(255,255,255,.06);border-radius:11px;padding:.6rem;font-size:.75rem;color:#a0b2c8;min-height:32px;line-height:1.6;border:1px solid rgba(255,255,255,.06)}
.hist b{color:#fff}
</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickTools">
<link rel="apple-touch-icon" href="/icon-192.png">
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>⚡ Reaction Time Test</h1>
<div class="pad wait" id="pad">Wait for GREEN...</div>
<div class="stats"><div class="st"><b id="last">—</b><small>Last</small></div><div class="st"><b id="avg">—</b><small>Avg</small></div><div class="st"><b id="best">—</b><small>Best</small></div><div class="st"><b id="tries">0</b><small>Tries</small></div></div>
<div class="hist" id="hist">Recent: —</div>
</div>
<script>
const $=i=>document.getElementById(i);
let state="wait",t0=0,best=null,tries=0,timer=null,list=[];
function reset(){state="wait";$("pad").className="pad wait";$("pad").textContent="Wait for GREEN...";clearTimeout(timer);timer=setTimeout(go,1500+Math.random()*2500)}
function go(){state="go";t0=performance.now();$("pad").className="pad go";$("pad").textContent="CLICK!"}
function click(){
  if(state==="wait"){clearTimeout(timer);$("pad").textContent="Too early! Click to retry";state="early";return}
  if(state==="early"){reset();return}
  if(state==="go"){
    const t=Math.round(performance.now()-t0);
    if(!best||t<best)best=t;tries++;list.push(t);
    const avg=Math.round(list.reduce((a,b)=>a+b,0)/list.length);
    $("last").textContent=t;$("avg").textContent=avg;$("best").textContent=best;$("tries").textContent=tries;
    $("hist").innerHTML="Recent: <b>"+list.slice(-8).join(" · ")+"</b> ms";
    $("pad").className="pad";$("pad").textContent=t+" ms — click for next";state="wait2";return;
  }
  if(state==="wait2")reset();
}
$("pad").onclick=click;reset();
</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body></html>
