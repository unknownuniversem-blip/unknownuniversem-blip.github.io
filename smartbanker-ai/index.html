<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SmartBanker AI</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px}.box{max-width:600px;margin:auto;background:#0f172a;padding:24px;border-radius:12px;border:1px solid #1e293b}input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff}button{background:#0284c7;cursor:pointer;font-weight:700}.chat{min-height:180px;background:#070c18;border-radius:8px;padding:12px;margin:12px 0;font-size:0.9rem}</style></head><body><div class="box"><h3>🏦 SmartBanker AI Assistant</h3><p style="color:#94a3b8;font-size:0.85rem">Banking awareness, RBI circulars & mock interview prep.</p><div class="chat" id="log">SmartBanker: Hello! Ask me about Repo Rate, CRR, SLR, or Banking terms.</div><div style="display:flex;gap:8px"><input type="text" id="inp" placeholder="Ask about banking terms..." style="flex-grow:1"><button onclick="reply()">Ask</button></div></div><script>function reply(){const q=document.getElementById('inp').value.toLowerCase();let a="Please refer to the latest RBI monetary policy update.";if(q.includes("repo")) a="Repo Rate is the interest rate at which RBI lends money to commercial banks against government securities.";if(q.includes("crr")) a="Cash Reserve Ratio (CRR) is the percentage of total deposits that banks must keep in liquid cash with the RBI.";if(q.includes("slr")) a="Statutory Liquidity Ratio (SLR) is the percentage of deposits banks maintain in safe securities like Gold & Govt bonds.";document.getElementById('log').innerHTML += `<br><br><b>You:</b> ${document.getElementById('inp').value}<br><b>SmartBanker:</b> ${a}`;document.getElementById('inp').value="";}</script></body></html>
