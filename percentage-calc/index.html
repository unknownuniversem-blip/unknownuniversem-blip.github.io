</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>📊 Marksheet Percentage Calculator</h1>
<p class="sub">Enter subject marks — get overall percentage & division.</p>
<div id="subs"></div>
<button class="add" onclick="addSub()">+ Add Subject</button>
<button class="add" style="background:#eaf0f9;color:#1e3b5c;box-shadow:none" onclick="calc()">📊 Calculate</button>
<div class="res" id="res" style="display:none">
<div style="font-size:.72rem;opacity:.85">Overall Percentage</div>
<div class="big" id="pct">—</div>
<div class="row2"><div>Division<b id="div">—</b></div><div>Total<b id="tot">0</b></div><div>Obtained<b id="obt">0</b></div></div>
</div>
<div class="share">
<span style="font-size:.75rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20Marksheet%20Percentage%20Calc%3A%20https://unknownuniversem-blip.github.io/percentage-calc/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/percentage-calc/?utm_source=telegram&utm_medium=share" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
let count=0;
function addSub(name="",total="",obt=""){
  count++;
  const div=document.createElement("div");
  div.className="row";
  div.innerHTML=`<input placeholder="Subject ${count}" value="${name}" style="flex:2">
  <input type="number" placeholder="Total" value="${total}" style="flex:1" class="t">
  <input type="number" placeholder="Marks" value="${obt}" style="flex:1" class="o">
  <button onclick="this.parentNode.remove()">×</button>`;
  $("subs").appendChild(div);
}
function calc(){
  const rows=$("subs").querySelectorAll(".row");
  let tot=0,obt=0;
  rows.forEach(r=>{
    const t=parseFloat(r.querySelector(".t").value)||0;
    const o=parseFloat(r.querySelector(".o").value)||0;
    tot+=t;obt+=o;
  });
  if(!tot)return alert("Enter subject marks first");
  const pct=obt/tot*100;
  $("pct").textContent=pct.toFixed(2)+"%";
  $("tot").textContent=tot;$("obt").textContent=obt;
  $("div").textContent=pct>=75?"Distinction":pct>=60?"1st Div":pct>=50?"2nd Div":pct>=40?"Pass":"Fail";
  $("res").style.display="block";
}
addSub("English",100,85);addSub("Math",100,92);addSub("Science",100,78);
</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
