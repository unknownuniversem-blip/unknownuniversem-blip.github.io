<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;padding:20px;box-sizing:border-box}.w{max-width:600px;margin:20px auto;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.drop{border:2px dashed #a9bed4;border-radius:1.2rem;padding:2rem;text-align:center;color:#5a6f88;cursor:pointer;background:#f6f9fd}.drop:hover{border-color:#1e3b5c}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin:1rem 0}.img{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eef4fa}.img img{width:100%;height:100%;object-fit:cover}.img button{position:absolute;top:4px;right:4px;background:#c62828;color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem;padding:0}button.main{background:#1e3b5c;color:#fff;border:none;padding:.8rem;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:.5rem}button.main:disabled{opacity:.4}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>🖼️ Image to PDF</h1><div class="drop" id="drop">📁 Click or drop images</div><input type="file" id="file" accept="image/*" multiple hidden><div class="imgs" id="list"></div><button class="main" id="go" disabled>📄 Create PDF</button><a href="../">← Back</a></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>const $=i=>document.getElementById(i);let imgs=[];$("drop").onclick=()=>$("file").click();$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};$("file").onchange=e=>add(e.target.files);async function add(fs){for(const f of fs){if(!f.type.startsWith("image/"))continue;const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});imgs.push(d)}render()}function render(){$("list").innerHTML=imgs.map((im,i)=>`<div class="img"><img src="${im}"><button onclick="del(${i})">×</button></div>`).join("");$("go").disabled=!imgs.length}function del(i){imgs.splice(i,1);render()}$("go").onclick=async()=>{if(!imgs.length)return;const pdf=new jspdf.jsPDF({unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();for(let i=0;i<imgs.length;i++){if(i)pdf.addPage();const img=new Image();img.src=imgs[i];await new Promise(r=>{img.onload=r});const r=Math.min(pw/img.width,ph/img.height),w=img.width*r,h=img.height*r;pdf.addImage(imgs[i],"JPEG",(pw-w)/2,(ph-h)/2,w,h)}pdf.save("images.pdf")};</script></body></html>
