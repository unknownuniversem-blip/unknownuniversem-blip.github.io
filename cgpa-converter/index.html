<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🎓 CGPA to % Converter</h1>
<p class="sub">Convert CGPA / SGPA to percentage using standard formulas.</p>
<label>CGPA (out of 10)</label>
<input type="number" id="cgpa" step="0.01" min="0" max="10" placeholder="e.g. 8.5" value="8.5">
<label>University Formula</label>
<select id="formula">
<option value="cbse">CBSE (× 9.5)</option>
<option value="du">Delhi University (× 9.5)</option>
<option value="mu">Mumbai Uni (× 7.25 + 11)</option>
<option value="anu">Anna University (×(CGPA-0.75)×10)</option>
<option value="vtu">VTU ((CGPA - 0.75) × 10)</option>
<option value="custom">Custom (×(x) + y)</option>
</select>
<div id="customBox" style="display:none">
<label>Multiplier</label><input type="number" id="mul" value="9.5" step="0.01">
<label>Add (constant)</label><input type="number" id="add" value="0" step="0.01">
</div>
<button class="btn" onclick="calc()">Convert to Percentage</button>
<div class="res" id="res"><div class="label">Percentage</div><div class="big" id="out">—</div><div id="extra" style="font-size:.78rem;opacity:.85;margin-top:4px"></div></div>
<div class="share">
<span style="font-size:.75rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20CGPA%20to%20%25%20converter%3A%20https://unknownuniversem-blip.github.io/cgpa-converter/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/cgpa-converter/?utm_source=telegram&utm_medium=share" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
$("formula").onchange=()=>{$("customBox").style.display=$("formula").value==="custom"?"block":"none"};
function calc(){
  const c=parseFloat($("cgpa").value);
  if(isNaN(c)||c<0||c>10)return alert("Enter valid CGPA (0-10)");
  let pct;
  const f=$("formula").value;
  if(f==="cbse"||f==="du")pct=c*9.5;
  else if(f==="mu")pct=c*7.25+11;
  else if(f==="anu"||f==="vtu")pct=(c-0.75)*10;
  else pct=c*(parseFloat($("mul").value)||9.5)+(parseFloat($("add").value)||0);
  $("out").textContent=pct.toFixed(2)+"%";
  const div=pct>=75?"Distinction":pct>=60?"First Division":pct>=50?"Second Division":pct>=40?"Pass":"Fail";
  $("extra").textContent="Division: "+div;
  $("res").style.display="block";
}
</script><script>
