<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Daily Calorie & BMI Calculator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px)}
.w{width:100%;max-width:520px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(16px,2.5vw,26px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 4px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.45rem);text-align:center;font-weight:700}
.sub{text-align:center;color:#5a6f88;font-size:.78rem;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;color:#5a6f88;font-size:.7rem;font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;padding:10px 13px;border:1px solid #d5e0ed;border-radius:11px;box-sizing:border-box;font-size:.88rem;background:#fff;margin-top:4px}
input:focus,select:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.btn{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:12px;font-size:.9rem;box-shadow:0 8px 20px -6px rgba(30,59,92,.5)}
.res{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:14px;padding:16px;margin-top:12px;text-align:center;display:none}
.res .big{font-size:clamp(1.5rem,5vw,2rem);font-weight:700;margin:.2rem 0}
.res .label{font-size:.7rem;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.res .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:.72rem}
.res .grid b{display:block;font-size:.95rem;margin-top:2px}
.share{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.share a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:600}
.share a.wa{background:#25D366;color:#fff}
.share a.tg{background:#0088cc;color:#fff}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🥗 Daily Calorie & BMI Calculator</h1>
<p class="sub">Calculate BMI, BMR, TDEE & daily calorie needs.</p>
<div class="row">
<div><label>Age</label><input type="number" id="age" value="25" min="10" max="100"></div>
<div><label>Gender</label><select id="gender"><option value="m">Male</option><option value="f">Female</option></select></div>
</div>
<div class="row">
<div><label>Height (cm)</label><input type="number" id="ht" value="170" min="80" max="250"></div>
<div><label>Weight (kg)</label><input type="number" id="wt" value="65" min="20" max="200"></div>
</div>
<label>Activity Level</label>
<select id="act">
<option value="1.2">Sedentary (desk job)</option>
<option value="1.375">Light (exercise 1-3 days)</option>
<option value="1.55" selected>Moderate (3-5 days)</option>
<option value="1.725">Active (6-7 days)</option>
<option value="1.9">Very Active (athlete)</option>
</select>
<button class="btn" onclick="calc()">Calculate</button>
<div class="res" id="res">
<div class="label">Your BMI</div>
<div class="big" id="bmi">—</div>
<div id="cat" style="font-size:.78rem;opacity:.9"></div>
<div class="grid">
<div>BMR<b id="bmr">—</b></div>
<div>TDEE<b id="tdee">—</b></div>
<div>Hydration<b id="hyd">—</b></div>
</div>
</div>
<div class="share">
<span style="font-size:.72rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20Calorie%20Calculator%3A%20https://unknownuniversem-blip.github.io/bmi-calorie-calc/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/bmi-calorie-calc/" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
function calc(){
  const age=+$("age").value,ht=+$("ht").value,wt=+$("wt").value,act=+$("act").value,g=$("gender").value;
  if(!age||!ht||!wt)return alert("Fill all fields");
  const bmi=wt/Math.pow(ht/100,2);
  const bmr=g==="m"?10*wt+6.25*ht-5*age+5:10*wt+6.25*ht-5*age-161;
  const tdee=bmr*act;
  const hyd=wt*0.033;
  $("bmi").textContent=bmi.toFixed(1);
  $("cat").textContent=bmi<18.5?"Underweight":bmi<25?"Normal ✓":bmi<30?"Overweight":"Obese";
  $("bmr").textContent=Math.round(bmr)+" kcal";
  $("tdee").textContent=Math.round(tdee)+" kcal";
  $("hyd").textContent=hyd.toFixed(1)+" L";
  $("res").style.display="block";
}
</script></body></html>
