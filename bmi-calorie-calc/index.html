<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Daily Calorie & BMI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b;text-align:left}
    input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff}
    .res{margin-top:15px;padding:12px;background:#070c18;border-radius:8px;text-align:center}
  </style>
</head>
<body>
  <div class="box">
    <h3 style="text-align:center;color:#10b981">🥗 Calorie & BMI Calculator</h3>
    <label style="font-size:0.8rem;color:#94a3b8">Weight (kg)</label><input type="number" id="w" value="68" oninput="calc()">
    <label style="font-size:0.8rem;color:#94a3b8">Height (cm)</label><input type="number" id="h" value="172" oninput="calc()">
    <label style="font-size:0.8rem;color:#94a3b8">Daily Activity</label>
    <select id="act" onchange="calc()">
      <option value="1.2">Sedentary (Student studying all day)</option>
      <option value="1.375">Light Exercise (1-3 days/week)</option>
      <option value="1.55">Moderate Activity (Daily 45m workout)</option>
    </select>
    <div class="res" id="res">BMI: 23.0 | Maintenance: 2050 kcal</div>
  </div>
  <script>
    function calc(){
      const w = parseFloat(document.getElementById('w').value)||0;
      const h = parseFloat(document.getElementById('h').value)/100||1;
      const act = parseFloat(document.getElementById('act').value);
      const bmi = (w / (h*h)).toFixed(1);
      const bmr = 10 * w + 6.25 * (h*100) - 5 * 22 + 5;
      const tdee = Math.round(bmr * act);
      document.getElementById('res').innerHTML = `<b>BMI:</b> ${bmi} <span style="color:#10b981">(Normal)</span><br><b>Maintenance:</b> ${tdee} kcal/day`;
    }
    calc();
  </script>
</body>
</html>
