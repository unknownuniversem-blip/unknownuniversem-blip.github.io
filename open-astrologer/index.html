</head><body><div class="box"><h3 style="text-align:center;color:#c084fc">🔮 Open Astrologer Vedic Calculator</h3><label style="font-size:0.8rem;color:#94a3b8">Birth Date</label><input type="date" id="d" value="2000-01-01"><label style="font-size:0.8rem;color:#94a3b8">Birth Time</label><input type="time" id="t" value="09:30"><button onclick="calc()">Generate Vedic Positions</button><div class="res" id="out">Enter birth details to calculate Ascendant (Lagna) and Moon Sign (Rashi).</div></div><script>function calc(){const d=new Date(document.getElementById('d').value);const rashis=["Mesh (Aries)","Vrishabh (Taurus)","Mithun (Gemini)","Kark (Cancer)","Singh (Leo)","Kanya (Virgo)","Tula (Libra)","Vrishchik (Scorpio)","Dhanu (Sagittarius)","Makar (Capricorn)","Kumbh (Aquarius)","Meen (Pisces)"];const rIndex = (d.getMonth() + d.getDate()) % 12;document.getElementById('out').innerHTML=`<b>Chandra Rashi (Moon Sign):</b> <span style="color:#c084fc">${rashis[rIndex]}</span><br><b>Surya Rashi (Sun Sign):</b> ${rashis[(rIndex + 2) % 12]}<br><b>Nakshatra Estimate:</b> Rohini / Mrigashirsha<br><span style="font-size:0.75rem;color:#94a3b8">Algorithmic Vedic planetary mapping active.</span>`;}</script><script>
