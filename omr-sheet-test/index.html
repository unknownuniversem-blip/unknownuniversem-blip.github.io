<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Digital OMR Practice Sheet · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭕</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;padding:clamp(8px,1.5vw,16px)}
.w{width:100%;max-width:820px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 4px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.45rem);text-align:center;font-weight:700}
.sub{text-align:center;color:#5a6f88;font-size:.78rem;margin-bottom:10px}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;font-size:.78rem}
.controls input{width:60px;padding:6px 8px;border:1px solid #d5e0ed;border-radius:8px;font-size:.82rem;text-align:center}
.controls button{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.8rem}
.controls button.sec{background:#eaf0f9;color:#1e3b5c}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;background:#fff;border-radius:12px;padding:12px}
.q{border:1px solid #e0e6ee;border-radius:9px;padding:6px;text-align:center;background:#fafcff}
.q .num{font-size:.7rem;color:#5a6f88;font-weight:700;margin-bottom:4px}
.opts{display:flex;justify-content:space-around;gap:4px}
.opt{width:22px;height:22px;border:1.5px solid #1e3b5c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#1e3b5c;cursor:pointer;font-weight:600;background:#fff;transition:.15s;user-select:none}
.opt:hover{background:#eaf0f9}
.opt.sel{background:#1e3b5c;color:#fff}
.share{display:flex;gap:6px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.share a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:600}
.share a.wa{background:#25D366;color:#fff}
.share a.tg{background:#0088cc;color:#fff}
</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>⭕ Digital OMR Practice Sheet</h1>
<p class="sub">Tap circles to practice marking. Auto-saves locally.</p>
<div class="controls">
<span>Questions: <input type="number" id="qn" value="50" min="10" max="200"></span>
<button onclick="build()">Build Sheet</button>
<button class="sec" onclick="clearAll()">Clear</button>
</div>
<div class="omr" id="omr"></div>
<div class="share">
<span style="font-size:.72rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20OMR%20Practice%3A%20https://unknownuniversem-blip.github.io/omr-sheet-test/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/omr-sheet-test/" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
const KEY="omr_answers";
let answers=JSON.parse(localStorage.getItem(KEY)||"{}");
function build(){
  const n=+$("qn").value;
  let html="";
  for(let i=1;i<=n;i++){
    html+=`<div class="q"><div class="num">Q${i}</div><div class="opts">`;
    ["A","B","C","D"].forEach(o=>{
      const sel=answers[i]===o?" sel":"";
      html+=`<div class="opt${sel}" data-q="${i}" data-o="${o}">${o}</div>`;
    });
    html+="</div></div>";
  }
  $("omr").innerHTML=html;
}
function toggle(q,o){
  if(answers[q]===o)delete answers[q];
  else answers[q]=o;
  localStorage.setItem(KEY,JSON.stringify(answers));
  build();
}
$("omr").addEventListener("click",e=>{
  const el=e.target.closest(".opt");
  if(el)toggle(+el.dataset.q,el.dataset.o);
});
function clearAll(){if(confirm("Clear all answers?")){answers={};localStorage.setItem(KEY,"{}");build()}}
build();
</script></body></html>
