<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Barcode Generator</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}button{background:#10b981;color:#042f2e;font-weight:bold;cursor:pointer}svg{margin-top:14px;background:#fff;padding:10px;border-radius:6px}</style><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script></head><body><div class="box"><h3>🏷️ Barcode Generator</h3><input type="text" id="val" value="SSC-2026-REG"><button onclick="gen()">Generate Barcode</button><br><svg id="barcode"></svg></div><script>function gen(){JsBarcode("#barcode", document.getElementById('val').value, {format: "CODE128", width:2, height:60, displayValue:true});}window.onload=gen;</script></body></html>
