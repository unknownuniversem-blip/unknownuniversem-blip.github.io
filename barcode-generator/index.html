<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Barcode Generator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);overflow-x:hidden}
.w{width:100%;max-width:520px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:4px 0 10px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.4rem);text-align:center;font-weight:700}
label{display:block;color:#5a6f88;font-size:.72rem;font-weight:600;margin-top:8px;text-transform:uppercase}
input,select{width:100%;padding:10px 13px;border:1px solid #d5e0ed;border-radius:11px;box-sizing:border-box;margin-top:5px;font-size:.9rem;background:#fff;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border:none;padding:11px;border-radius:12px;font-weight:600;cursor:pointer;font-size:.85rem;box-shadow:0 6px 16px -6px rgba(30,59,92,.5)}
.row button.sec{background:#eaf0f9;color:#1e3b5c;box-shadow:none}
.box{background:#fff;border-radius:12px;padding:12px;text-align:center;margin-top:12px;border:1px dashed #d5e0ed;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.box svg{max-width:100%}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>📊 Barcode Generator</h1>
<label>Value</label><input id="val" value="9780199532179">
<label>Format</label><select id="fmt"><option>CODE128</option><option>EAN13</option><option>UPC</option><option>CODE39</option></select>
<div class="row"><button onclick="gen()">🔄 Generate</button><button class="sec" onclick="dl()">⬇ PNG</button></div>
<div class="box" id="box"><p style="color:#8899aa;font-size:.82rem">Enter value & click Generate</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
const $=i=>document.getElementById(i);
function gen(){const v=$("val").value.trim();if(!v)return;$("box").innerHTML=`<svg id="svg"></svg>`;try{JsBarcode("#svg",v,{format:$("fmt").value,width:2,height:80,displayValue:true,fontSize:14,margin:10})}catch(e){$("box").innerHTML=`<p style="color:#c62828">Invalid: ${e.message}</p>`}}
function dl(){const svg=document.getElementById("svg");if(!svg)return alert("Generate first");const xml=new XMLSerializer().serializeToString(svg);const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);const a=document.createElement("a");a.download="barcode.png";a.href=c.toDataURL("image/png");a.click()};img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)))}
$("val").oninput=gen;$("fmt").onchange=gen;gen();
</script></body></html>
