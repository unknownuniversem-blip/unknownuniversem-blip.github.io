<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode Generator · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>"><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:560px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.6rem}input,select{width:100%;padding:.7rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}.row{display:flex;gap:8px;margin-top:1rem}.row button{flex:1;background:#1e3b5c;color:#fff;border:none;padding:.7rem;border-radius:12px;font-weight:600;cursor:pointer}.row button.sec{background:#eaf0f9;color:#1e3b5c}.box{background:#fff;border-radius:1rem;padding:1rem;text-align:center;margin-top:1rem;border:1px dashed #d5e0ed;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column}.box svg{max-width:100%}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>📊 Barcode Generator</h1><label>Value</label><input id="val" value="9780199532179"><label>Format</label><select id="fmt"><option>CODE128</option><option>EAN13</option><option>UPC</option><option>CODE39</option></select><div class="row"><button onclick="gen()">🔄 Generate</button><button class="sec" onclick="dl()">⬇ PNG</button></div><div class="box" id="box"><p style="color:#8899aa;font-size:.85rem">Enter value & click Generate</p></div><a href="../">← Back</a></div><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const $=i=>document.getElementById(i);function gen(){const v=$("val").value.trim();if(!v)return;$("box").innerHTML=`<svg id="svg"></svg>`;try{JsBarcode("#svg",v,{format:$("fmt").value,width:2,height:80,displayValue:true,fontSize:14,margin:10})}catch(e){$("box").innerHTML=`<p style="color:#c62828">Invalid: ${e.message}</p>`}}function dl(){const svg=document.getElementById("svg");if(!svg)return alert("Generate first");const xml=new XMLSerializer().serializeToString(svg);const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);const a=document.createElement("a");a.download="barcode.png";a.href=c.toDataURL("image/png");a.click()};img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)))}["val"].forEach(id=>$(id).oninput=gen);$("fmt").onchange=gen;gen();</script></body></html>
