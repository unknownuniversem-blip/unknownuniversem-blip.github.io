<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode Generator · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:560px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.6rem}input,select{width:100%;padding:.7rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}button{background:#1e3b5c;color:#fff;border:none;padding:.7rem;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:1rem}.box{background:#fff;border-radius:1rem;padding:1rem;text-align:center;margin-top:1rem;border:1px dashed #d5e0ed;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column}.box svg{max-width:100%}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>📊 Barcode Generator</h1><label>Value</label><input id="val" value="9780199532179"><label>Format</label><select id="fmt"><option>CODE128</option><option>EAN13</option><option>UPC</option><option>CODE39</option></select><button onclick="gen()">Generate</button><div class="box" id="box"><p style="color:#8899aa;font-size:.85rem">Enter value & click</p></div><a href="../">← Back</a></div><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const $=i=>document.getElementById(i);function gen(){const v=$("val").value.trim();if(!v)return;$("box").innerHTML="<svg id=\"svg\"></svg>";try{JsBarcode("#svg",v,{format:$("fmt").value,width:2,height:80,displayValue:true,fontSize:14,margin:10})}catch(e){$("box").innerHTML="<p style=\"color:#c62828\">Invalid: "+e.message+"</p>"}}$("val").oninput=gen;$("fmt").onchange=gen;gen();</script></body></html>
