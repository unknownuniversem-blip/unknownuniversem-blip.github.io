<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🧘 20-20-20 Eye Chime</h1>
<p class="sub">Every 20 min — look 20 ft away for 20 sec. Also posture reminder.</p>
<div class="circle"><div class="ring"></div><div class="time" id="time">20:00</div><div class="label" id="label">Until next break</div></div>
<label>Interval (minutes)</label><input type="number" id="interval" value="20" min="1" max="120">
<label>Break duration (seconds)</label><input type="number" id="dur" value="20" min="5" max="120">
<button class="btn" id="startBtn" onclick="toggle()">▶ Start Reminders</button>
<div class="share">
<span style="font-size:.7rem;color:#5a6f88;align-self:center">Share:</span>
<a class="wa" href="https://wa.me/?text=Check%20Eye%20Chime%3A%20https://unknownuniversem-blip.github.io/desk-posture-bell/" target="_blank">💬 WhatsApp</a>
<a class="tg" href="https://t.me/share/url?url=https://unknownuniversem-blip.github.io/desk-posture-bell/?utm_source=telegram&utm_medium=share" target="_blank">✈️ Telegram</a>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
let timer=null,running=false,remaining=0,phase="work";
function beep(f,d){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type="sine";o.frequency.value=f;g.gain.value=0.2;o.start();o.stop(ctx.currentTime+d)}catch(e){}
}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")}
function tick(){
  remaining--;
  if(remaining<=0){
    if(phase==="work"){phase="break";remaining=+$("dur").value;beep(1000,0.3);setTimeout(()=>beep(1200,0.3),350);$("label").textContent="Look away! Rest eyes"}
    else{phase="work";remaining=+$("interval").value*60;beep(600,0.15);$("label").textContent="Until next break"}
  }
  $("time").textContent=fmt(remaining);
}
function toggle(){
  if(running){clearInterval(timer);running=false;$("startBtn").innerHTML="▶ Start Reminders";$("startBtn").className="btn"}
  else{
    remaining=+$("interval").value*60;phase="work";$("label").textContent="Until next break";
    timer=setInterval(tick,1000);running=true;$("startBtn").innerHTML="⏸ Pause";$("startBtn").className="btn pause";
  }
}
</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
