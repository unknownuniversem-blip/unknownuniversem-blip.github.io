<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Typing Speed Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:600px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}
    .passage{background:#131d35;padding:14px;border-radius:8px;text-align:left;line-height:1.5;color:#94a3b8;margin-bottom:15px}
    input{width:100%;padding:12px;background:#070c18;border:1px solid #334155;color:#fff;border-radius:8px;font-size:1rem;outline:none}
  </style>
</head>
<body>
  <div class="box">
    <h3>⌨️ Typing Speed & Accuracy Test</h3>
    <div class="passage" id="txt">The quick brown fox jumps over the lazy dog to practice SSC CHSL typing speed.</div>
    <input type="text" id="inp" placeholder="Start typing here..." oninput="check(this)">
    <div style="margin-top:15px;color:#38bdf8;font-weight:bold" id="stat">WPM: 0 | Accuracy: 100%</div>
  </div>
  <script>
    let start = null;
    function check(el){
      if(!start) start = new Date();
      const txt = document.getElementById('txt').innerText;
      const val = el.value;
      const min = (new Date() - start) / 60000;
      const words = val.trim().split(/\s+/).length;
      const wpm = min > 0 ? Math.round(words / min) : 0;
      document.getElementById('stat').innerText = `WPM: ${wpm} | Typed: ${val.length} chars`;
    }
  </script>
</body>
</html>
