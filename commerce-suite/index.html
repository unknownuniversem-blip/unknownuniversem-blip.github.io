const CLASS_11 = [
{n:1, title:"Introduction to Accounting", summary:"Meaning, objectives, users, branches, qualitative characteristics",
concepts:[
"<strong>Accounting</strong> = Process of identifying, measuring, recording, classifying, summarising, analysing, interpreting & communicating financial information to users",
"<strong>Objectives of Accounting:</strong> (1) Maintain systematic records (2) Determine profit/loss (3) Show financial position (4) Provide information to users (5) Assist management",
"<strong>Internal Users:</strong> Owners, Management, Employees — inside the organisation",
"<strong>External Users:</strong> Investors, Creditors, Banks, Govt, Tax authorities, Consumers, Researchers, Public",
"<strong>Qualitative Characteristics:</strong> Reliability · Relevance · Understandability · Comparability",
"<strong>Book-keeping:</strong> Only recording of transactions — primary stage",
"<strong>Accounting:</strong> Book-keeping + Summarising + Analysing + Interpreting + Communicating",
"<strong>Accountancy:</strong> Body of knowledge — the parent discipline",
"<strong>Branches:</strong> Financial Accounting · Cost Accounting · Management Accounting · Tax Accounting",
"<strong>Accounting Process Flow:</strong> Source documents → Journal → Ledger → Trial Balance → Financial Statements",
"<strong>Transaction vs Event:</strong> Transaction = external exchange; Event = internal happening (e.g. depreciation)",
"<strong>Cash vs Credit:</strong> Cash = immediate payment; Credit = future payment",
"<strong>Drawings:</strong> Money/goods withdrawn by owner for personal use — reduces capital",
"<strong>Capital vs Revenue:</strong> Capital = long-term benefit; Revenue = short-term benefit"
],
formulas:[
["Accounting Equation","Assets = Liabilities + Capital"],
["Expanded Equation","A = L + (Capital + Revenue − Expenses − Drawings)"],
["Capital","Assets − Liabilities"],
["Net Worth","Total Assets − External Liabilities"],
["Profit/Loss","Revenue − Expenses"],
["Drawings effect","Reduces capital (debit to Drawings, credit to Cash)"]
],
journal:null,
formats:null,
tips:[
"Every transaction always satisfies the accounting equation — verify",
"Drawings are NOT an expense — they reduce capital",
"Money measurement concept ignores non-financial items (e.g. employee skill)"
]},

{n:2, title:"Theory Base of Accounting", summary:"GAAP, concepts, conventions, accounting standards, bases",
concepts:[
"<strong>GAAP</strong> — Generally Accepted Accounting Principles: rules accountants follow",
"<strong>Business Entity concept:</strong> Business is separate from owner — owner's personal transactions NOT recorded",
"<strong>Money Measurement concept:</strong> Only transactions measurable in money are recorded (qualitative items ignored)",
"<strong>Going Concern concept:</strong> Business will continue for foreseeable future — justifies asset valuation at cost",
"<strong>Accounting Period concept:</strong> Life of business divided into equal intervals (usually 1 year)",
"<strong>Cost concept:</strong> Assets recorded at acquisition cost, NOT market value",
"<strong>Dual Aspect concept:</strong> Every transaction has 2 effects — debit + credit. Basis of double entry",
"<strong>Revenue Recognition:</strong> Revenue recorded when earned, NOT when cash received",
"<strong>Matching concept:</strong> Expenses matched with revenues of the SAME period",
"<strong>Accrual basis:</strong> Record revenue/expense when earned/incurred (mandatory for companies)",
"<strong>Cash basis:</strong> Record only when cash received/paid (not allowed for companies)",
"<strong>Full Disclosure:</strong> All material facts must be disclosed",
"<strong>Consistency:</strong> Same methods period after period for comparability",
"<strong>Conservatism (Prudence):</strong> Provide for all losses, ignore anticipated profits — but never understate",
"<strong>Materiality:</strong> Only items significant enough to affect decisions are recorded",
"<strong>Objectivity:</strong> Records must be based on verifiable evidence, not opinion",
"<strong>Accounting Standards:</strong> Issued by ICAI — AS-1 to AS-29 and Ind-AS",
"<strong>Fundamental Accounting Assumptions:</strong> Going Concern · Consistency · Accrual"
],
formulas:null,
journal:null,
formats:null,
tips:[
"Accrual basis is mandatory for companies — not cash basis",
"Conservatism ≠ creating hidden reserves — it's about prudence",
"Going concern justifies depreciation (asset's cost spread over useful life)"
]},

{n:3, title:"Recording of Transactions — Journal", summary:"Source documents, rules of debit/credit, journal entries, compound entries",
concepts:[
"<strong>Source documents:</strong> Cash memo · Invoice · Receipt · Cheque · Debit Note · Credit Note · Pay-in-slip · Bank statement",
"<strong>Journal:</strong> Book of original entry — chronological record before posting to ledger",
"<strong>Account types:</strong> Personal (persons/firms) · Real (assets) · Nominal (expenses/incomes)",
"<strong>Rules of Debit/Credit:</strong>",
"  • <strong>Personal A/c:</strong> Debit the receiver, Credit the giver",
"  • <strong>Real A/c:</strong> Debit what comes in, Credit what goes out",
"  • <strong>Nominal A/c:</strong> Debit expenses/losses, Credit incomes/gains",
"<strong>Compound entry:</strong> One entry with multiple debits/credits",
"<strong>Opening entry:</strong> First entry to bring forward old balances",
"<strong>Narration:</strong> Brief explanation written after each entry in brackets",
"<strong>L.F. (Ledger Folio):</strong> Reference number to ledger page",
"<strong>Trade Discount vs Cash Discount:</strong> Trade = on list price (not recorded); Cash = on payment (recorded)",
"<strong>Goods vs Assets:</strong> Goods purchased for resale; Assets for use"
],
formulas:null,

formats:`JOURNAL FORMAT

{n:4, title:"Ledger and Trial Balance", summary:"Posting, balancing accounts, trial balance, types of errors",
concepts:[
"<strong>Ledger:</strong> Principal book containing ALL accounts (personal, real, nominal)",
"<strong>Posting:</strong> Transferring entries from journal to ledger",
"<strong>Balancing:</strong> Difference between debit & credit side = closing balance",
"<strong>Debit balance on:</strong> Assets, Expenses, Drawings, Losses",
"<strong>Credit balance on:</strong> Liabilities, Income, Capital, Gains",
"<strong>Nominal accounts:</strong> Closed at year-end by transferring to Trading/P&L A/c",
"<strong>Real & Personal accounts:</strong> Carry forward balance to next year",
"<strong>Trial Balance:</strong> Statement of all ledger balances to verify arithmetic accuracy",
"<strong>Format: Total method OR Balance method</strong>",
"<strong>Errors affecting TB (one-sided errors):</strong>",
"  • Partial omission",
"  • Wrong amount in one account",
"  • Posting to wrong side of one account",
"  • Double posting to same side",
"<strong>Errors NOT affecting TB (two-sided errors):</strong>",
"  • Complete omission",
"  • Error of principle",
"  • Compensating errors",
"  • Wrong account posting (both sides)",
"<strong>Suspense A/c:</strong> Temporary account to balance TB till errors found"
],
formulas:[
["Closing balance (Asset)","Opening + Debits − Credits"],
["Closing balance (Liability)","Opening + Credits − Debits"],
["Trial Balance agreement","Σ Debits = Σ Credits"],
["Suspense A/c","Difference in Trial Balance"]
],

concepts:[
"<strong>BRS:</strong> Statement reconciling bank balance per Cash Book with balance per Pass Book on a specific date",
"<strong>Cash Book (Bank column):</strong> Business's record of bank transactions",

concepts:[
"<strong>Depreciation:</strong> Systematic allocation of fixed asset's cost over its useful life",

"<strong>SLM (Straight Line):</strong> Equal amount each year; asset can reach zero",
"<strong>WDV (Written Down Value):</strong> Fixed % on book value; asset NEVER reaches zero",
"<strong>SLM vs WDV:</strong> SLM = simple but ignores changing asset value; WDV = realistic but complex",
"<strong>Provision:</strong> Charge against profit for known liability with uncertain amount",
"<strong>Reserve:</strong> Appropriation of profit — belongs to owners",
"<strong>Types of Reserves:</strong>",
"  • General Reserve (free reserve)",
"  • Specific Reserve (for specific purpose)",
"  • Capital Reserve (from capital profits)",
"  • Secret Reserve (hidden)",
"<strong>Provision vs Reserve:</strong> Provision = charge (compulsory); Reserve = appropriation (discretionary)",
"<strong>Reserve Fund vs Reserve:</strong> Fund = reserve invested in securities",
"<strong>Investment Fluctuation Reserve:</strong> Created against decline in investment value"
],

{n:8, title:"Rectification of Errors", summary:"Types of errors, suspense account, one-sided vs two-sided errors",
concepts:[
"<strong>Error of Omission — Complete:</strong> Transaction completely left out — doesn't affect TB",
"<strong>Error of Omission — Partial:</strong> Only one side posted — affects TB",
"<strong>Error of Commission:</strong> Wrong amount, wrong account, wrong side",
"  • Wrong amount in one account → affects TB",
"  • Wrong amount in both accounts → doesn't affect TB",
"  • Wrong account (both sides) → doesn't affect TB",
"<strong>Error of Principle:</strong> Capital vs Revenue confused (e.g. machinery repairs debited to Machinery)",
"<strong>Compensating Errors:</strong> Two errors cancel each other",
"<strong>Errors affecting Trial Balance:</strong>",
"  • Partial omission",
"  • Wrong amount in ONE account",
"  • Posting to wrong side of one account",
"  • Double posting to same side",
"<strong>Errors NOT affecting Trial Balance:</strong>",
"  • Complete omission",
"  • Error of principle",
"  • Compensating errors",
"  • Wrong account (both sides)",
"<strong>Suspense A/c:</strong> Temporary account — created when TB doesn't agree",
"<strong>Rectification timing:</strong> (a) Before closing books (b) After closing books (via P&L Adjustment A/c)"
],

let currentClass = 11;
const $ = id => document.getElementById(id);

function showScreen(name){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
$("screen-"+name).classList.add("active");
}
function goHome(){showScreen("home")}
function goBackToList(){openClass(currentClass)}

function openClass(n){

$("chapterList").innerHTML =
'<div class="chapter-header"><h2>Class '+n+' — Accountancy</h2><p>'+list.length+' chapters · full formulas, journal entries, formats &amp; tips</p></div>' +

function openChapter(i){

const ch = list[i];

function openSearch(){
$("searchInput").value = "";
$("searchResults").innerHTML = "";
showScreen("search");
setTimeout(()=>$("searchInput").focus(), 100);
}

function doSearch(){
const q = $("searchInput").value.trim().toLowerCase();
if (!q){$("searchResults").innerHTML="";return}
let results = [];
[["Class 11", 11, CLASS_11],["Class 12", 12, CLASS_12]].forEach(([label, num, list])=>{
list.forEach((ch, i)=>{
const hay = [
ch.title, ch.summary,
...(ch.concepts||[]),
...(ch.formulas||[]).flat(),
ch.journal||"",
ch.formats||"",
...(ch.tips||[])
].join(" ").toLowerCase();
if (hay.includes(q)) results.push({label, num, i, ch});
});
});
if (!results.length){
$("searchResults").innerHTML = '<div class="recent-empty">No matches found</div>';
return;
}
$("searchResults").innerHTML = results.map(r=>'<button class="chapter-card" onclick="jumpTo('+r.num+','+r.i+')"><span class="ch-num">'+r.label+'</span><div class="ch-title">'+r.ch.title+'</div><div class="ch-sum">'+r.ch.summary+'</div></button>').join("");
}

function jumpTo(cls, idx){
currentClass = cls;
openChapter(idx);
}
</script>
<script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
