<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>GST Quick Calculator</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b;text-align:left}input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}.res{margin-top:12px;padding:12px;background:#070c18;border-radius:8px;font-size:1rem;color:#10b981;font-weight:bold;text-align:center}</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickTools">
<link rel="apple-touch-icon" href="/icon-192.png">
</head><body><div class="box"><h3 style="text-align:center;color:#10b981">🧾 GST Fast Calculator</h3><label style="font-size:0.8rem;color:#94a3b8">Amount (₹)</label><input type="number" id="amt" value="1000" oninput="calc()"><label style="font-size:0.8rem;color:#94a3b8">GST Slab Rate</label><select id="r" onchange="calc()"><option value="0.05">5%</option><option value="0.12">12%</option><option value="0.18" selected>18%</option><option value="0.28">28%</option></select><div class="res" id="res">GST: ₹180 | Total: ₹1,180</div></div><script>function calc(){const a=parseFloat(document.getElementById('amt').value)||0;const r=parseFloat(document.getElementById('r').value);const gst=a*r;document.getElementById('res').innerHTML=`GST Tax: ₹${gst.toFixed(2)}<br>Total Invoice: ₹${(a+gst).toFixed(2)}`;}calc();</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body></html>
