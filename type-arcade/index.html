<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Type Arcade</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:500px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}input{padding:10px;width:100%;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body><div class="box"><h3>🕹️ Type Arcade Speed Sprint</h3><div id="w" style="font-size:2rem;font-weight:bold;color:#38bdf8;margin:15px 0">focus</div><input type="text" id="inp" placeholder="Type the word above..." oninput="chk(this)"><div style="margin-top:12px;color:#10b981" id="sc">Score: 0</div></div><script>const words=["velocity","accuracy","cadence","aptitude","discipline","aspirant","focus","speed"];let sc=0;function chk(e){if(e.value.trim().toLowerCase()===document.getElementById('w').innerText){sc+=10;document.getElementById('sc').innerText="Score: "+sc;e.value="";document.getElementById('w').innerText=words[Math.floor(Math.random()*words.length)];}}</script></body></html>
