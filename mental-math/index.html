<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Mental Math Sprint · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);overflow:hidden}
.w{width:100%;max-width:440px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(14px,2.5vw,22px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative;max-height:98vh;max-height:98dvh;display:flex;flex-direction:column}
.hub{position:absolute;top:10px;left:10px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.68rem;font-weight:600;padding:4px 10px;border-radius:999px}
h1{margin:4px 0 8px;color:#1e2b3c;font-size:clamp(1.1rem,3.4vw,1.35rem);text-align:center;font-weight:700}
.tabs{display:flex;gap:4px;margin-bottom:8px;background:#eaf0f9;padding:3px;border-radius:11px}
.tabs button{flex:1;background:transparent;border:none;padding:7px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.76rem;color:#5a6f88}
.tabs button.on{background:#fff;color:#1e3b5c;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-around;background:#eaf0f9;padding:8px;border-radius:11px;font-weight:600;color:#1e3b5c;margin-bottom:8px}
.top b{display:block;font-size:clamp(1rem,3vw,1.3rem)}
.top small{font-size:.62rem;color:#5a6f88}
.q{font-size:clamp(1.8rem,7vw,2.6rem);text-align:center;font-weight:700;color:#1e3b5c;padding:clamp(12px,3vw,22px) 8px;background:linear-gradient(145deg,#f6f9fd,#eef4fa);border-radius:14px;margin-bottom:8px}
.ans{font-size:clamp(1.3rem,4.5vw,1.8rem);text-align:center;color:#1e3b5c;background:#e8f5e9;border-radius:11px;padding:.5rem;margin-bottom:8px;min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .15s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pad button{background:#eaf0f9;color:#1e3b5c;border:none;padding:clamp(10px,2.5vw,14px);border-radius:11px;font-size:clamp(1rem,3vw,1.15rem);font-weight:700;cursor:pointer;transition:.1s}
.pad button:hover{background:#d5e0ed}
.pad button:active{transform:scale(.96)}
</style>  <script data-goatcounter="https://quicktools.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>🧠 Mental Math Sprint</h1>
<div class="tabs" id="tabs"><button data-d="easy" class="on">Easy</button><button data-d="medium">Medium</button><button data-d="hard">Hard</button></div>
<div class="top"><div>Score<b id="sc">0</b><small>correct</small></div><div>Streak<b id="st">0</b><small>best <span id="bst">0</span></small></div><div>Time<b id="tm">60s</b><small>left</small></div></div>
<div class="q" id="q">—</div>
<div class="ans" id="a">_</div>
<div class="pad" id="pad"></div>
</div>
<script>
const $=i=>document.getElementById(i);
let ans=0,sc=0,st=0,bst=0,time=60,timer=null,inp="",diff="easy";
const R={easy:10,medium:50,hard:100};
function nQ(){const M=R[diff],o=["+","-","×"][Math.floor(Math.random()*3)];let a,b;
  if(o==="+"){a=Math.floor(Math.random()*M)+1;b=Math.floor(Math.random()*M)+1;ans=a+b}
  else if(o==="-"){a=Math.floor(Math.random()*M)+2;b=Math.floor(Math.random()*a);ans=a-b}
  else{a=Math.floor(Math.random()*(M/5))+2;b=Math.floor(Math.random()*(M/5))+2;ans=a*b}
  $("q").textContent=a+" "+o+" "+b+" = ?"}
function tick(){time--;$("tm").textContent=time+"s";if(time<=0)end()}
function end(){clearInterval(timer);$("q").textContent="⏱ Time!";$("a").textContent=sc+" correct"}
function press(k){
  if(time<=0)return;
  if(k==="C")inp="";
  else if(k==="←")inp=inp.slice(0,-1);
  else if(k==="="){
    if(parseInt(inp,10)===ans){sc++;st++;if(st>bst)bst=st;$("sc").textContent=sc;$("st").textContent=st;$("bst").textContent=bst;$("a").style.background="#c8e6c9";setTimeout(()=>$("a").style.background="#e8f5e9",200)}
    else{st=0;$("st").textContent=0;$("a").style.background="#ffcdd2";setTimeout(()=>$("a").style.background="#e8f5e9",200)}
    inp="";nQ();
  }
  else if(/[0-9]/.test(k))inp+=k;
  $("a").textContent=inp||"_";
}
$("pad").innerHTML=["7","8","9","4","5","6","1","2","3","C","0","←"].map(k=>`<button onclick="press('${k}')">${k}</button>`).join("")+`<button onclick="press('=')" style="grid-column:span 3;background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff">✓ Submit</button>`;
document.addEventListener("keydown",e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Enter")press("=");else if(e.key==="Backspace"){press("←");e.preventDefault()}else if(e.key==="Escape")press("C")});
$("tabs").onclick=e=>{if(e.target.dataset.d){diff=e.target.dataset.d;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.d===diff));nQ()}};
nQ();timer=setInterval(tick,1000);
</script></body></html>
