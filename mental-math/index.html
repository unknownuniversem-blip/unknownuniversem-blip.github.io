<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Math Sprint · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>"><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:520px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}.tabs{display:flex;gap:6px;margin-bottom:1rem}.tabs button{flex:1;background:#eaf0f9;color:#1e3b5c;border:none;padding:.6rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}.tabs button.on{background:#1e3b5c;color:#fff}.top{display:flex;justify-content:space-around;background:#eaf0f9;padding:1rem;border-radius:1rem;font-weight:600;color:#1e3b5c;margin-bottom:1rem}.top b{display:block;font-size:1.5rem}.top small{font-size:.7rem;color:#5a6f88}.q{font-size:3rem;text-align:center;font-weight:700;color:#1e3b5c;padding:2rem 1rem;background:#f6f9fd;border-radius:1.2rem;margin-bottom:1rem}.ans{font-size:2rem;text-align:center;color:#1e3b5c;background:#e8f5e9;border-radius:1rem;padding:.6rem;margin-bottom:.8rem;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{background:#eaf0f9;color:#1e3b5c;border:none;padding:1rem;border-radius:12px;font-size:1.2rem;font-weight:700;cursor:pointer}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>🧠 Mental Math Sprint</h1><div class="tabs" id="tabs"><button data-d="easy" class="on">Easy</button><button data-d="medium">Medium</button><button data-d="hard">Hard</button></div><div class="top"><div>Score<b id="sc">0</b><small>correct</small></div><div>Streak<b id="st">0</b><small>best <span id="bst">0</span></small></div><div>Time<b id="tm">60s</b><small>left</small></div></div><div class="q" id="q">—</div><div class="ans" id="a">_</div><div class="pad" id="pad"></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);let ans=0,sc=0,st=0,bst=0,time=60,timer=null,inp="",diff="easy";const R={easy:10,medium:50,hard:100};function nQ(){const M=R[diff],o=["+","-","×"][Math.floor(Math.random()*3)];let a,b;if(o==="+"){a=Math.floor(Math.random()*M)+1;b=Math.floor(Math.random()*M)+1;ans=a+b}else if(o==="-"){a=Math.floor(Math.random()*M)+2;b=Math.floor(Math.random()*a);ans=a-b}else{a=Math.floor(Math.random()*(M/5))+2;b=Math.floor(Math.random()*(M/5))+2;ans=a*b}$("q").textContent=a+" "+o+" "+b+" = ?"}function tick(){time--;$("tm").textContent=time+"s";if(time<=0)end()}function end(){clearInterval(timer);$("q").textContent="⏱ Time!";$("a").textContent=sc+" correct"}function press(k){if(time<=0)return;if(k==="C")inp="";else if(k==="←")inp=inp.slice(0,-1);else if(k==="="){if(parseInt(inp,10)===ans){sc++;st++;if(st>bst)bst=st;$("sc").textContent=sc;$("st").textContent=st;$("bst").textContent=bst;$("a").style.background="#c8e6c9";setTimeout(()=>$("a").style.background="#e8f5e9",200)}else{st=0;$("st").textContent=0;$("a").style.background="#ffcdd2";setTimeout(()=>$("a").style.background="#e8f5e9",200)}inp="";nQ()}else if(/[0-9]/.test(k))inp+=k;$("a").textContent=inp||"_"}$("pad").innerHTML=["7","8","9","4","5","6","1","2","3","C","0","←"].map(k=>`<button onclick="press('${k}')">${k}</button>`).join("")+`<button onclick="press('=')" style="grid-column:span 3;background:#1e3b5c;color:#fff">✓ Submit</button>`;document.addEventListener("keydown",e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Enter")press("=");else if(e.key==="Backspace"){press("←");e.preventDefault()}else if(e.key==="Escape")press("C")});$("tabs").onclick=e=>{if(e.target.dataset.d){diff=e.target.dataset.d;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.d===diff));nQ()}};nQ();timer=setInterval(tick,1000);</script></body></html>
