<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:520px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.8rem}input{width:100%;padding:.8rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}button{background:#1e3b5c;color:#fff;border:none;padding:.8rem;border-radius:12px;font-weight:600;cursor:pointer;width:100%;margin-top:1rem}.res{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:1.2rem;padding:1.5rem;margin-top:1rem;text-align:center;display:none}.res .big{font-size:2rem;font-weight:700;margin:.4rem 0}.res .row{display:flex;justify-content:space-around;font-size:.85rem;opacity:.9;margin-top:.6rem}.res b{display:block;font-size:1.2rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>🎂 Age Calculator</h1><label>Date of Birth</label><input type="date" id="dob"><label>As on</label><input type="date" id="asof"><button onclick="calc()">Calculate</button><div class="res" id="res"><div>Your Age</div><div class="big" id="big">—</div><div class="row"><div>Months<b id="m">0</b></div><div>Days<b id="d">0</b></div><div>Total Days<b id="td">0</b></div></div></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);$("asof").valueAsDate=new Date();function calc(){const dob=new Date($("dob").value),ao=new Date($("asof").value);if(isNaN(dob)||isNaN(ao)||dob>ao)return alert("Check dates");let y=ao.getFullYear()-dob.getFullYear(),m=ao.getMonth()-dob.getMonth(),d=ao.getDate()-dob.getDate();if(d<0){m--;d+=new Date(ao.getFullYear(),ao.getMonth(),0).getDate()}if(m<0){y--;m+=12}const td=Math.floor((ao-dob)/86400000);$("big").textContent=y+" years";$("m").textContent=m;$("d").textContent=d;$("td").textContent=td.toLocaleString();$("res").style.display="block"}</script></body></html>
