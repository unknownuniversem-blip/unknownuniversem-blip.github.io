<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>PET 1600m Cadence Pacer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}
    .bpm{font-size:4.5rem;font-weight:900;color:#f97316;margin:10px 0}
    input{width:100%;margin:15px 0}
    button{background:#f97316;color:#fff;padding:12px 24px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h3>⚡ PET 1600m Cadence Metronome</h3>
    <p style="color:#94a3b8;font-size:0.8rem">Auditory footsteps pacer for Police & Agniveer physical tests</p>
    <div class="bpm" id="v">170</div>
    <input type="range" min="140" max="200" value="170" oninput="set(this.value)">
    <br><button id="btn" onclick="toggle()">Start Pacer Click</button>
  </div>
  <script>
    let spm=170, t=null;
    function set(val){ spm=parseInt(val); document.getElementById('v').innerText=spm; if(t){ clearInterval(t); t=setInterval(click, (60/spm)*1000); } }
    function click(){
      try{
        const c = new (window.AudioContext||window.webkitAudioContext)();
        const o = c.createOscillator(); const g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value = 850; g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.05);
        o.start(); o.stop(c.currentTime + 0.05);
      }catch(e){}
    }
    function toggle(){
      if(t){ clearInterval(t); t=null; document.getElementById('btn').innerText="Start Pacer Click"; }
      else { t=setInterval(click, (60/spm)*1000); document.getElementById('btn').innerText="Stop Pacer"; }
    }
  </script>
</body>
</html>
