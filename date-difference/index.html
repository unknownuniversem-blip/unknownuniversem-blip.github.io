<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Date Difference · Master Hub</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#eef4fb,#dde6f2);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.5vw,16px);overflow:hidden}
.w{width:100%;max-width:520px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:clamp(18px,3.5vw,28px);padding:clamp(16px,2.5vw,24px);box-shadow:0 30px 60px -20px rgba(20,40,80,.25);position:relative;max-height:96vh;max-height:96dvh;overflow-y:auto}
.hub{position:absolute;top:12px;left:12px;background:#1e3b5c;color:#fff;text-decoration:none;font-size:.7rem;font-weight:600;padding:5px 11px;border-radius:999px}
h1{margin:6px 0 8px;color:#1e2b3c;font-size:clamp(1.15rem,3.5vw,1.4rem);text-align:center;font-weight:700}
label{display:block;color:#5a6f88;font-size:.72rem;font-weight:600;margin-top:8px;text-transform:uppercase}
input{width:100%;padding:clamp(8px,1.8vw,11px) 14px;border:1px solid #d5e0ed;border-radius:11px;box-sizing:border-box;font-size:.9rem;background:#fff;font-family:inherit}
input:focus{outline:none;border-color:#1e3b5c;box-shadow:0 0 0 3px rgba(30,59,92,.12)}
.res{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:13px;padding:clamp(10px,2vw,14px);margin-top:10px;text-align:center}
.big{font-size:clamp(1.2rem,4vw,1.5rem);font-weight:700;margin:.15rem 0}
.row{display:flex;justify-content:space-around;font-size:.72rem;opacity:.9;margin-top:.3rem}
.row b{display:block;font-size:clamp(.9rem,2.5vw,1.1rem)}
.sec{margin-top:14px;padding-top:10px;border-top:1px dashed #d5e0ed}
.sec h3{font-size:.9rem;color:#1e2b3c;margin:0 0 6px}
</style></head><body>
<div class="w">
<a href="../" class="hub">🏠 Hub</a>
<h1>📅 Date Difference</h1>
<label>From</label><input type="date" id="d1">
<label>To</label><input type="date" id="d2">
<div class="res"><div style="font-size:.7rem;opacity:.8">DIFFERENCE</div><div class="big" id="big">—</div><div class="row"><div>Days<b id="d">0</b></div><div>Weeks<b id="w">0</b></div><div>Months<b id="m">0</b></div></div></div>
<div class="sec"><h3>➕ Add / Subtract days</h3>
<input type="date" id="base"><input type="number" id="offset" placeholder="+ / - days" value="30" style="margin-top:6px">
<div class="res" style="margin-top:8px"><div style="font-size:.7rem;opacity:.8">RESULT</div><div class="big" id="newDate">—</div></div>
</div>
</div>
<script>
const $=i=>document.getElementById(i);const t=new Date();
$("d1").valueAsDate=t;$("d2").valueAsDate=new Date(t.getTime()+30*86400000);$("base").valueAsDate=t;
function fmt(d){return d.toLocaleDateString("en-IN",{weekday:"short",year:"numeric",month:"short",day:"numeric"})}
function calc(){
  const a=new Date($("d1").value),b=new Date($("d2").value);if(isNaN(a)||isNaN(b))return;
  const s=b<a?-1:1;[lo,hi]=s>0?[a,b]:[b,a];
  let y=hi.getFullYear()-lo.getFullYear(),m=hi.getMonth()-lo.getMonth(),d=hi.getDate()-lo.getDate();
  if(d<0){m--;d+=new Date(hi.getFullYear(),hi.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  const tot=Math.floor((hi-lo)/86400000);
  $("big").textContent=(s>0?"+":"")+y+"y "+m+"m "+d+"d";
  $("d").textContent=s*tot;$("w").textContent=(s*tot/7).toFixed(1);$("m").textContent=(s*tot/30.44).toFixed(1);
}
function addDays(){
  const base=new Date($("base").value),off=parseInt($("offset").value)||0;
  if(isNaN(base))return;
  const nd=new Date(base.getTime()+off*86400000);
  $("newDate").textContent=fmt(nd);
}
["d1","d2"].forEach(id=>$(id).onchange=calc);
["base","offset"].forEach(id=>$(id).oninput=addDays);
calc();addDays();
</script></body></html>
