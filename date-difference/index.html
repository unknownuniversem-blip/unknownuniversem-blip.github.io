<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Difference · Master Hub</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#f7f9fc,#e9eef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.w{max-width:520px;width:100%;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 20px 40px -10px rgba(30,40,60,.15)}h1{margin:0 0 1rem;color:#1e2b3c;font-size:1.5rem}label{display:block;color:#5a6f88;font-size:.85rem;font-weight:600;margin-top:.8rem}input{width:100%;padding:.8rem;border:1px solid #d5e0ed;border-radius:12px;box-sizing:border-box;margin-top:.3rem}.res{background:linear-gradient(135deg,#1e3b5c,#2f5575);color:#fff;border-radius:1.2rem;padding:1.4rem;margin-top:1rem;text-align:center}.big{font-size:2rem;font-weight:700;margin:.3rem 0}.row{display:flex;justify-content:space-around;font-size:.8rem;opacity:.9;margin-top:.8rem}.row b{display:block;font-size:1.1rem;margin-top:.2rem}a{display:block;text-align:center;margin-top:1rem;color:#5a6f88;text-decoration:none;font-size:.85rem}</style></head><body><div class="w"><h1>📅 Date Difference</h1><label>From</label><input type="date" id="d1"><label>To</label><input type="date" id="d2"><div class="res"><div>Difference</div><div class="big" id="big">—</div><div class="row"><div>Days<b id="d">0</b></div><div>Weeks<b id="w">0</b></div><div>Months<b id="m">0</b></div></div></div><a href="../">← Back</a></div><script>const $=i=>document.getElementById(i);const t=new Date();$("d1").valueAsDate=t;$("d2").valueAsDate=new Date(t.getTime()+30*86400000);function calc(){const a=new Date($("d1").value),b=new Date($("d2").value);if(isNaN(a)||isNaN(b))return;const s=b<a?-1:1;[lo,hi]=s>0?[a,b]:[b,a];let y=hi.getFullYear()-lo.getFullYear(),m=hi.getMonth()-lo.getMonth(),d=hi.getDate()-lo.getDate();if(d<0){m--;d+=new Date(hi.getFullYear(),hi.getMonth(),0).getDate()}if(m<0){y--;m+=12}const tot=Math.floor((hi-lo)/86400000);$("big").textContent=(s>0?"+":"")+y+"y "+m+"m "+d+"d";$("d").textContent=s*tot;$("w").textContent=(s*tot/7).toFixed(1);$("m").textContent=(s*tot/30.44).toFixed(1)}["d1","d2"].forEach(id=>$(id).onchange=calc);calc();</script></body></html>
