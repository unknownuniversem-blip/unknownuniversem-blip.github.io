<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>UPI & Link QR Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}
    .box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}
    input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff}
    button{background:#38bdf8;color:#070c18;font-weight:bold;cursor:pointer}
    img{margin-top:15px;background:#fff;padding:8px;border-radius:8px}
  </style>
</head>
<body>
  <div class="box">
    <h3>📱 Instant QR Code Generator</h3>
    <input type="text" id="val" value="https://unknownuniversem-blip.github.io/">
    <button onclick="gen()">Generate Printable QR</button>
    <div id="out"></div>
  </div>
  <script>
    function gen(){
      const v = encodeURIComponent(document.getElementById('val').value);
      document.getElementById('out').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${v}">`;
    }
    gen();
  </script>
</body>
</html>
