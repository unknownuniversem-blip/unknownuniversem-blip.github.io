<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>WhatsApp Direct Chat</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#070c18;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:440px;margin:auto;background:#0f172a;padding:24px;border-radius:14px;border:1px solid #1e293b}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#131d35;color:#fff;box-sizing:border-box}button{background:#22c55e;color:#052e16;font-weight:bold;cursor:pointer}</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickTools">
<link rel="apple-touch-icon" href="/icon-192.png">
</head><body><div class="box"><h3>💬 WhatsApp Direct Chat</h3><p style="color:#94a3b8;font-size:0.85rem">Chat without saving unknown numbers to your contacts.</p><input type="text" id="num" placeholder="Enter phone with country code (e.g. 919876543210)"><button onclick="openChat()">Open WhatsApp Chat</button></div><script>function openChat(){const n=document.getElementById('num').value.replace(/[^0-9]/g,'');if(!n) return alert('Enter phone number');window.open('https://wa.me/' + n, '_blank');}</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body></html>
